/* ---------- programming ---------- */
const SPLITS = {
  2:[["Full body A",["lower","push","pull","lower","core"]],["Full body B",["lower","pull","push","lower","core"]]],
  3:[["Full body A",["lower","push","pull","lower","core"]],["Full body B",["lower","pull","push","core","lower"]],["Full body C",["lower","push","pull","lower","core"]]],
  4:[["Upper A",["push","pull","push","pull","core"]],["Lower A",["lower","lower","lower","core","lower"]],["Upper B",["pull","push","pull","push","core"]],["Lower B",["lower","lower","core","lower","lower"]]],
  5:[["Push",["push","push","push","push","core"]],["Pull",["pull","pull","pull","pull","core"]],["Legs",["lower","lower","lower","lower","core"]],["Upper",["push","pull","push","pull","core"]],["Lower",["lower","lower","lower","core","lower"]]],
  6:[["Push A",["push","push","push","push","core"]],["Pull A",["pull","pull","pull","pull","core"]],["Legs A",["lower","lower","lower","lower","core"]],["Push B",["push","push","push","push","core"]],["Pull B",["pull","pull","pull","pull","core"]],["Legs B",["lower","lower","lower","lower","core"]]]
};
function exPool(p){
  const lv = p.level || "b", lvOk = e => lv === "e" || e.level === "b" || (lv === "i" && e.level === "i") || !e.level;
  let pool = EXS.filter(e => e.gen && e.impact <= p.impact && exAvailable(e, p.equipment) && lvOk(e));
  if (p.lifestyle === "road") pool = pool.filter(e => !e.x && e.equip.every(q => ["bands","chair","rope"].includes(q)) && e.impact <= Math.min(p.impact, 2));
  return pool;
}
function buildWeek(p, seed){
  const rnd = mulberry32(seed*31+7), days = clamp(p.daysPerWeek,2,6), idx = DAY_PATTERNS[days];
  const pool = exPool(p), gymish = p.equipment.some(q => ["barbell","cable","machine","dumbbells","kettlebell"].includes(q));
  const lists = {}, cursor = {};
  for (const pat of ["lower","push","pull","core","cardio"]){
    const arr = shuffle(pool.filter(e => e.pattern === pat), rnd);
    // compound, loaded lifts first for strength goals; the rest keep their shuffled order
    arr.sort((a,b) => ((b.compound?2:0) + (gymish && b.loaded?1:0)) - ((a.compound?2:0) + (gymish && a.loaded?1:0)));
    const head = arr.slice(0, Math.max(6, Math.ceil(arr.length*0.25))), tail = arr.slice(head.length);
    lists[pat] = shuffle(head, rnd).concat(shuffle(tail, rnd)).slice(0, 40); cursor[pat] = 0;
  }
  const take = pat => { const l = lists[pat]; if (!l || !l.length) return null; const e = l[cursor[pat] % l.length]; cursor[pat]++; return e; };
  const sets = p.goal === "gain" ? 4 : 3;
  const dose = e => ({ex:e.id, sets, reps: e.metric === "time" ? (p.goal === "loss" ? Math.max(e.dose, 40) : e.dose) : e.loaded ? (p.goal === "gain" ? (e.compound ? 8 : 10) : p.goal === "loss" ? 12 : 10) : (p.goal === "loss" ? Math.round(e.dose*1.15) : e.dose)});
  const week = Array(7).fill(null);
  const split = p.lifestyle === "road" ? idx.map((_, i) => [["Cab-side circuit","Truck-stop strength","Hotel-room burner"][i % 3], ["lower","push","pull","core","lower","cardio"]]) : SPLITS[days];
  idx.forEach((d, i) => {
    let [name, pats] = split[i % split.length];
    pats = pats.slice(); if (p.goal === "loss" && p.lifestyle !== "road") pats.push("cardio");
    const items = [], used = new Set();
    for (const pat of pats){ let e = take(pat), tries = 0; while (e && used.has(e.id) && tries < 8){ e = take(pat); tries++; } if (e && !used.has(e.id)){ used.add(e.id); items.push(dose(e)); } }
    week[d] = {name, items};
  });
  return week;
}

/* ---------- progressive overload ---------- */
function loadStep(e){ const kg = isUS() ? (e.pattern === "lower" && !e.equip.includes("dumbbells") ? 10 : 5)/LB : (e.pattern === "lower" && !e.equip.includes("dumbbells") ? 5 : 2.5); return kg; }
const roundLoad = kg => { const step = isUS() ? 2.5/LB : 1.25; return Math.round(kg/step)*step; };
function nextFor(exId, target){
  const e = EX[exId], lp = lastPerf(exId);
  if (!lp) return {first:true, load:0, reps:target, text: e.loaded ? "First time: pick a weight you could lift 2–3 more reps with." : ""};
  const s = lp.it.sets, hit = s.every(x => (x.v||0) >= target), near = s.every(x => (x.v||0) >= target - 2), last = s[0].load || 0;
  if (e.loaded && last){
    if (hit){ const n = roundLoad(last + loadStep(e)); return {load:n, reps:target, up:true, text:`Next: ${s.length} × ${target} @ ${loadDisp(n)} ${wUnit()} (up ${fmt1(wDisp(n-last))})`}; }
    if (!near && s.filter(x => (x.v||0) < target - 4).length > s.length/2){ const n = roundLoad(last*0.9); return {load:n, reps:target, text:`Next: ${s.length} × ${target} @ ${loadDisp(n)} ${wUnit()} (lighter to rebuild)`}; }
    return {load:last, reps:target, text:`Next: same ${loadDisp(last)} ${wUnit()}, aim for one more rep per set`};
  }
  if (e.metric === "time") return {load:0, reps: hit ? target + 5 : target, up:hit, text: hit ? `Next: hold ${target + 5} s` : `Next: hold ${target} s`};
  if (hit && target >= 20) return {load:0, reps:target, text:"You've mastered this. Swap in a harder version or add weight."};
  return {load:0, reps: hit ? target + 2 : target, up:hit, text: hit ? `Next: ${target + 2} reps per set` : `Next: ${target} reps per set`};
}
function makeDraft(di){
  makeDraft0(di);
  for (const it of ui.draft.items){ const n = nextFor(it.ex, it.target); it.sug = n.text;
    if (n.up && !EX[it.ex].loaded) it.target = n.reps;
    if (EX[it.ex].loaded && n.load) for (const s of it.sets) s.load = r1(wDisp(n.load)); }
}
function perfText(exId){ const it = ui.draft && ui.draft.items.find(x => x.ex === exId); const base = perfText0(exId); return it && it.sug ? `${base} · ${it.sug}` : base; }

/* ---------- library ---------- */
const lib2 = {q:"", muscle:"all", equip:"all", level:"all", cat:"all", coll:"all", n:48};
const MUSCLES = ["chest","shoulders","triceps","biceps","forearms","lats","middle back","lower back","traps","abdominals","quadriceps","hamstrings","glutes","calves","adductors","abductors","neck"];
function libList(p){
  const q = lib2.q.trim().toLowerCase(), words = q.split(/\s+/).filter(Boolean), L = ui.lib;
  const C = (COLLECTIONS.find(c => c[0] === lib2.coll) || COLLECTIONS[0])[2];
  return EXS.filter(e => L.impact.includes(e.impact) && C(e)
    && (lib2.muscle === "all" || (e.prim ? e.prim.includes(lib2.muscle) : e.muscles.toLowerCase().includes(lib2.muscle.replace("quadriceps","quad").replace("abdominals","core"))))
    && (lib2.equip === "all" || (lib2.equip === "mine" ? exAvailable(e, p.equipment) : lib2.equip === "none" ? !e.equip.length : e.equip.includes(lib2.equip)))
    && (lib2.level === "all" || (e.level || "b") === lib2.level)
    && (lib2.cat === "all" || (e.cat || "home") === lib2.cat)
    && (!words.length || words.every(w => (e.name + " " + e.muscles + " " + (e.cat||"")).toLowerCase().includes(w))))
    .map((e, i) => [e, (e.vid ? 0 : e.img || (e.wimg && e.wimg.length) ? 1 : 2), i]).sort((a, b) => a[1] - b[1] || a[2] - b[2]).map(x => x[0]);

/* ======================================================================
   Adaptive calorie targets. Each week Rep & Ration compares what you ate with how your
   weight trend moved and re-estimates your real energy expenditure (TDEE), then sets
   your target from that estimate and the weekly pace you chose.
   ====================================================================== */
const KCAL_PER_KG = 7700;
const RATES = {loss:[[0.25,"Gentle · 0.25%/week"],[0.5,"Steady · 0.5%/week"],[0.75,"Faster · 0.75%/week"],[1,"Aggressive · 1%/week"]], gain:[[0.1,"Lean · 0.1%/week"],[0.25,"Steady · 0.25%/week"],[0.5,"Faster · 0.5%/week"]], maintain:[[0,"Hold steady"]]};
const defaultRate = g => g === "loss" ? 0.5 : g === "gain" ? 0.25 : 0;
function calc(p){ return dietMacros(calc1(p), p); }
function dietMacros(c, p){
  if (p.diet === "keto"){ c.carbs = 30; c.fat = Math.max(0, Math.round((c.target - c.protein*4 - c.carbs*4)/9)); }
  else if (p.diet === "lowcarb"){ c.carbs = Math.round(c.target*0.20/4); c.fat = Math.max(0, Math.round((c.target - c.protein*4 - c.carbs*4)/9)); }
  else if (p.diet === "highprotein"){ c.protein = Math.max(c.protein, Math.round(c.target*0.35/4)); c.carbs = Math.max(50, Math.round((c.target - c.protein*4 - c.fat*9)/4)); }
  return c;
}
function calc1(p){
  const c = calc0(p);
  const est = p.adaptive !== false && p.tdeeEst && p.tdeeEst.kcal ? p.tdeeEst.kcal : null;
  const usingRate = p.rate != null || est;
  if (!usingRate) return Object.assign(c, {formulaTdee:c.tdee, adaptive:false});
  const tdee = est || c.tdee, rate = p.rate != null ? p.rate : defaultRate(p.goal);
  let adj = p.goal === "loss" ? -(rate/100)*p.weightKg*KCAL_PER_KG/7 : p.goal === "gain" ? (rate/100)*p.weightKg*KCAL_PER_KG/7 : 0;
  if (p.goal === "loss") adj = Math.max(adj, -Math.min(tdee*0.30, 1100));
  const floor = p.sex === "male" ? 1500 : 1200;
  let target = tdee + adj; const floored = target < floor; target = Math.round(Math.max(target, floor)/10)*10;
  const basis = c.bmi >= 30 ? 25*(p.heightCm/100)**2 : p.weightKg, pk = {loss:2.0, gain:1.8, maintain:1.6}[p.goal];
  const protein = Math.round(basis*pk), fat = Math.round(Math.max(target*(p.goal === "maintain" ? .30 : .25)/9, p.weightKg*0.6));
  const carbs = Math.max(50, Math.round((target - protein*4 - fat*9)/4));
  return Object.assign(c, {formulaTdee:c.tdee, tdee, adj, target, floored, protein, fat, carbs, addedSugar:Math.round(target*0.10/4), fiber:Math.round(target/1000*14), adaptive:!!est, rate});
}

/* exponentially smoothed weight trend, one point per calendar day */
function weightTrend(days = 120){
  const w = sortedWeights(); if (!w.length) return [];
  const map = Object.fromEntries(w.map(x => [x.date, x.kg]));
  const start = pkey(w[0].date), end = new Date(), out = [];
  let t = w[0].kg;
  for (let d = new Date(start); d <= end; d = addDays(d, 1)){ const k = dkey(d); if (map[k] != null) t = t + 0.1*(map[k] - t); out.push([k, t, map[k] ?? null]); }
  return out.slice(-days);
}
function slope(pts){ const n = pts.length; if (n < 2) return 0; let sx=0, sy=0, sxx=0, sxy=0; pts.forEach(([x,y]) => { sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; }); const d = n*sxx - sx*sx; return d ? (n*sxy - sx*sy)/d : 0; }
/** Observed expenditure over the last `win` days, or null when there isn't enough data. */
function observedTdee(win = 21){
  const tr = weightTrend(win + 1); if (tr.length < 10) return null;
  const keys = tr.map(x => x[0]);
  const intake = keys.map(k => dayTotals(k).kcal).filter(v => v >= 800);   // skip days that clearly weren't fully logged
  const weighIns = tr.filter(x => x[2] != null).length;
  if (intake.length < 5 || weighIns < 3) return {enough:false, intakeDays:intake.length, weighIns};
  const kgPerDay = slope(tr.map((x, i) => [i, x[1]]));
  const avg = intake.reduce((a,b) => a+b, 0)/intake.length;
  return {enough:true, kcal: avg - kgPerDay*KCAL_PER_KG, avgIntake:avg, kgPerWeek:kgPerDay*7, intakeDays:intake.length, weighIns, quality: Math.min(1, intake.length/14)*Math.min(1, weighIns/6)};
}
function proposeEstimate(){
  const p = state.profile, o = observedTdee(); if (!o || !o.enough) return null;
  const c0 = calc0(p), prior = p.tdeeEst && p.tdeeEst.kcal ? p.tdeeEst.kcal : c0.tdee;
  let next = prior + (o.kcal - prior)*0.75*o.quality;
  next = clamp(next, prior - 250, prior + 250);              // move at most 250 kcal a week
  next = clamp(next, c0.bmr*1.05, c0.bmr*2.6);
  return {kcal: Math.round(next/10)*10, prior: Math.round(prior), obs: o};
}
const checkinDue = () => { const p = state.profile, last = p.tdeeEst && p.tdeeEst.at; return p.adaptive !== false && (!last || Date.now() - last > 6.5*864e5) && !!proposeEstimate(); };
function checkinCard(){
  if (!checkinDue()) return "";
  const p = state.profile, pr = proposeEstimate(), before = calc(p).target;
  const after = calc(Object.assign({}, p, {tdeeEst:{kcal:pr.kcal}})).target, diff = after - before;
  const dir = pr.obs.kgPerWeek;
  return `<section class="card checkin stack"><div class="row"><span class="eyebrow">Weekly check-in</span><span class="spacer"></span><span class="pill neutral">Adaptive</span></div>
    <h2>${diff === 0 ? "Your target stays the same" : diff > 0 ? `Your target goes up ${fmt(diff)} kcal` : `Your target goes down ${fmt(-diff)} kcal`}</h2>
    <p class="small muted">Over the last 3 weeks you averaged <b>${fmt(pr.obs.avgIntake)} kcal</b> and your trend weight moved <b>${dir >= 0 ? "+" : "−"}${fmt1(Math.abs(wDisp(dir)))} ${wUnit()}/week</b>. That puts your real daily burn near <b>${fmt(pr.kcal)} kcal</b> (was ${fmt(pr.prior)}).</p>
    <div class="row"><button class="btn primary" data-act="checkinYes">Update to ${fmt(after)} kcal</button><button class="btn" data-act="checkinNo">Keep ${fmt(before)}</button></div></section>`;
}
A.checkinYes = () => { const p = state.profile, pr = proposeEstimate(); if (!pr) return; const hist = (p.tdeeEst && p.tdeeEst.hist) || [];
  p.tdeeEst = {kcal:pr.kcal, at:Date.now(), hist:[...hist, {d:todayKey(), kcal:pr.kcal, target:calc(Object.assign({}, p, {tdeeEst:{kcal:pr.kcal}})).target}].slice(-52)};
  persist("profile"); render(); toast("Targets updated for this week"); };
A.checkinNo = () => { const p = state.profile; p.tdeeEst = Object.assign({}, p.tdeeEst || {kcal:0}, {at:Date.now()}); if (!p.tdeeEst.kcal) delete p.tdeeEst.kcal; persist("profile"); render(); };

function expenditureCard(){
  const p = state.profile, c = calc(p), o = observedTdee(), hist = (p.tdeeEst && p.tdeeEst.hist) || [];
  const tr = weightTrend(60);
  return `<section class="card stack"><div class="card-head" style="margin:0"><div><h2>Energy expenditure</h2><p class="small muted">${c.adaptive ? "Adaptive: learned from your logs and weigh-ins" : "Estimated from your stats until there's enough data"}</p></div><span class="big num" style="font-size:1.8rem">${fmt(c.tdee)}<span class="small muted"> kcal/day</span></span></div>
    ${hist.length > 1 ? lineChart([{pts:hist.map(h => [pkey(h.d).getTime(), h.kcal]), color:"var(--accent)", end:true, dots:true},{pts:hist.map(h => [pkey(h.d).getTime(), h.target]), color:"var(--protein)", dash:"5 4"}], {h:170, label:"Expenditure and target by week"}) + `<div class="legend"><span><i style="background:var(--accent)"></i>Expenditure</span><span><i style="background:var(--protein)"></i>Target</span></div>` : ""}
    ${tr.length > 6 ? lineChart([{pts:tr.filter(x => x[2] != null).map(x => [pkey(x[0]).getTime(), wDisp(x[2])]), color:"var(--muted)", dots:true, faint:true, width:1},{pts:tr.map(x => [pkey(x[0]).getTime(), wDisp(x[1])]), color:"var(--accent)", width:2.6, end:true}], {h:170, label:"Trend weight"}) + `<div class="legend"><span><i style="background:var(--accent)"></i>Trend weight</span><span><i style="background:var(--muted)"></i>Weigh-ins</span></div>` : ""}
    <p class="small muted">${o && o.enough ? `Last 3 weeks: ${o.intakeDays} logged days, ${o.weighIns} weigh-ins, trend ${o.kgPerWeek >= 0 ? "+" : "−"}${fmt1(Math.abs(wDisp(o.kgPerWeek)))} ${wUnit()}/week.` : `Log food most days and weigh in 3+ times a week. After about 10 days we start learning your real burn${o ? ` (so far: ${o.intakeDays || 0} logged days, ${o.weighIns || 0} weigh-ins)` : ""}.`}</p>
    <label class="check" style="border:0;padding:0"><input type="checkbox" data-act="adaptiveToggle" ${p.adaptive !== false ? "checked" : ""}><span style="text-decoration:none;color:var(--ink)">Adjust my targets every week from my results</span></label></section>`;
}
A.adaptiveToggle = el => { state.profile.adaptive = el.checked; persist("profile"); render(); };
function paceSelect(id){ const p = state.profile, r = p.rate != null ? p.rate : defaultRate(p.goal); return `<select id="${id}" data-field="rate">${RATES[p.goal].map(([v,l]) => `<option value="${v}" ${Math.abs(v-r)<1e-6?"selected":""}>${l}${p.goal !== "maintain" ? ` (${fmt1(wDisp(p.weightKg*v/100))} ${wUnit()})` : ""}</option>`).join("")}</select>`; }

/* ======================================================================
   Coach mode. Trainers on a Coach plan get a client dashboard with each client's
   meals, workouts and weight trend, plus messaging. Anyone can connect to a coach
   with the coach's code and choose exactly what that coach sees.
   ====================================================================== */
window.RR_COACH = {mine:null, clients:null, limit:0, code:"", sel:null, detail:null, unread:0, busy:false, err:""};
const CO = window.RR_COACH;
const isCoachPlan = () => !!(me() && me().coach);
const canPost = () => isCoachPlan();  // uploads are for members on a Coach plan only
async function coachLoad(){
  if (!PUB || !me() || !me().sub.active) return;
  try {
    const m = await api("coach/mine"); CO.mine = m.coaches || [];
    if (isCoachPlan()){
      const [c, k] = await Promise.all([api("coach/clients"), CO.code ? Promise.resolve({code:CO.code}) : api("coach/code")]);
      CO.clients = c.clients || []; CO.limit = c.limit; CO.code = k.code;
      if (CO.sel) CO.detail = await api("coach/client", {id:CO.sel}).catch(() => null);
    }
    CO.unread = (CO.clients || []).filter(c => c.unread).length + (CO.mine || []).filter(c => c.msgs.length && !c.msgs[c.msgs.length-1].mine && (c.msgs[c.msgs.length-1].at > (state.profile.coachSeen || ""))).length;
  } catch (e){ CO.err = e.message; }
  if (ui.view === "coach") { if (!isTyping()) render(); } else renderNav();
}
const isTyping = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest("#view"); };
setInterval(() => { if (!document.hidden && ui.view === "coach") coachLoad(); }, 45000);
const msgList = msgs => `<div class="msgs">${msgs.length ? msgs.map(m => `<div class="msg ${m.mine ? "mine" : ""}"><p>${esc(m.text)}</p><small>${ago(new Date(m.at).getTime())}</small></div>`).join("") : `<p class="empty">No messages yet.</p>`}</div>`;
const msgForm = to => `<form class="row" data-form="coachMsg" data-to="${esc(to)}"><input type="text" name="t" maxlength="1000" placeholder="Write a message" style="flex:1;min-width:160px" aria-label="Message"><button class="btn primary">Send</button></form>`;

function clientDetail(d){
  const p = Object.assign(defaultProfile(), d.profile || {}), hasW = d.profile && d.profile.weightKg;
  const c = hasW ? calc(p) : null, us = p.units === "us", wd = kg => us ? kg*LB : kg, wu = us ? "lb" : "kg";
  const days = []; for (let i = 13; i >= 0; i--) days.push(dkey(addDays(new Date(), -i)));
  const tot = k => (d.food && d.food[k] || []).reduce((a,e) => { a.k += e.kcal*e.q; a.p += e.p*e.q; a.c += e.c*e.q; a.f += e.f*e.q; return a; }, {k:0,p:0,c:0,f:0});
  const w = (d.weights || []).slice().sort((a,b) => a.date < b.date ? -1 : 1);
  return `<section class="card stack"><div class="card-head" style="margin:0"><div><span class="eyebrow">Client</span><h2 style="font-size:1.3rem">${esc(d.name)}</h2><p class="small muted">${GOALS[p.goal] || ""}${p.age ? ` · ${p.age} y` : ""}${p.faith && p.faith !== "none" ? ` · ${esc((FAITHS[p.faith]||[p.faith])[0])}` : ""}${p.diet && p.diet !== "any" ? ` · ${esc((DIETS.find(x => x[0]===p.diet)||["",p.diet])[1])}` : ""}</p></div>
    <div class="row"><button class="btn sm" data-act="coBack">All clients</button><button class="btn sm danger" data-act="coRemove" data-id="${esc(CO.sel)}">Remove</button></div></div>
    ${c ? `<div class="grid g-3"><div class="kv" style="flex-direction:column;border:0"><span class="eyebrow">Target</span><span class="big" style="font-size:1.5rem">${fmt(c.target)} kcal</span></div><div class="kv" style="flex-direction:column;border:0"><span class="eyebrow">Protein</span><span class="big" style="font-size:1.5rem">${c.protein} g</span></div><div class="kv" style="flex-direction:column;border:0"><span class="eyebrow">Weight</span><span class="big" style="font-size:1.5rem">${fmt1(wd(p.weightKg))} ${wu}</span></div></div>` : ""}</section>
  ${d.food ? `<section class="card"><h2 style="margin-bottom:8px">Food · last 14 days</h2><div class="tablewrap"><table class="tbl"><thead><tr><th>Day</th><th>kcal</th><th>P</th><th>C</th><th>F</th></tr></thead><tbody>${days.slice().reverse().map(k => { const t = tot(k), off = c && t.k ? Math.abs(t.k - c.target)/c.target : 0; return `<tr><td>${shortDate(k)}</td><td class="num" style="${t.k ? (off > .15 ? "color:var(--warn);font-weight:700" : "color:var(--good);font-weight:700") : "color:var(--muted)"}">${t.k ? fmt(t.k) : "—"}</td><td class="num">${t.k ? fmt(t.p) : ""}</td><td class="num">${t.k ? fmt(t.c) : ""}</td><td class="num">${t.k ? fmt(t.f) : ""}</td></tr>`; }).join("")}</tbody></table></div></section>` : `<section class="card"><p class="muted">${esc(d.name)} isn't sharing food logs with you.</p></section>`}
  ${d.weights ? `<section class="card"><h2 style="margin-bottom:8px">Weight</h2>${lineChart([{pts:w.map(x => [pkey(x.date).getTime(), wd(x.kg)]), color:"var(--accent)", end:true, dots:true, area:true}], {h:180, label:"Client weight"})}</section>` : ""}

function matchFoodId(name){

  return {goal: p.goal, diet: p.diet || "standard", daysLogged: logged.length, calorieTarget: c.target, avgCalories: avg("kcal"), proteinTarget: c.protein, avgProtein: avg("p"),
    avgCarbs: avg("c"), avgFat: avg("f"), avgSugar: avg("s"), workouts: sess.length, setsDone: sess.reduce((a, s) => a + s.items.reduce((b, it) => b + it.sets.length, 0), 0),

    avgSteps: stepsDays.length ? Math.round(stepsDays.reduce((a,b) => a+b, 0)/stepsDays.length) : null, avgWaterGlasses: waterDays.length ? r1(waterDays.reduce((a,b) => a+b, 0)/waterDays.length) : null,

  if (!isPremium() && !(photos.list && photos.list.length)) return `<section class="card stack"><h2>Progress photos</h2><p class="small muted">Private before-and-after photos, side by side, so you can see changes the scale misses.</p><button class="btn sm" data-act="upgrade" data-f="Progress photos">${LOCK} Unlock with Premium</button></section>`;
  if (photos.list === null && !photos.busy) photosLoad();
  const L = photos.list || [], first = L[0], last = L.at(-1);
  return `<section class="card stack"><div class="card-head" style="margin:0"><h2>Progress photos</h2><span class="small muted">Only you can see these</span></div>
    ${L.length >= 2 ? `<div class="grid g-2 photocmp"><figure><img src="/api/photo/${first.id}" alt="First photo" loading="lazy"><figcaption>${shortDate(first.date)}${first.weight ? ` · ${fmt1(first.weight)} ${wUnit()}` : ""}</figcaption></figure><figure><img src="/api/photo/${last.id}" alt="Latest photo" loading="lazy"><figcaption>${shortDate(last.date)}${last.weight ? ` · ${fmt1(last.weight)} ${wUnit()}` : ""}</figcaption></figure></div>` : ""}
    ${L.length ? `<div class="photostrip">${L.slice().reverse().map(p => `<div class="ph"><img src="/api/photo/${p.id}" alt="Photo from ${shortDate(p.date)}" loading="lazy"><small>${shortDate(p.date)} · ${p.pose}</small><button class="btn sm ghost" data-act="photoDel" data-id="${p.id}" aria-label="Delete photo">✕</button></div>`).join("")}</div>` : `<p class="small muted">No photos yet. Same spot, same light, once a week works best.</p>`}
    ${photos.err ? `<p class="small" style="color:var(--bad)">${esc(photos.err)}</p>` : ""}
    <div class="row"><select id="photoPose" aria-label="Pose"><option value="front">Front</option><option value="side">Side</option><option value="back">Back</option></select>
      <label class="btn sm primary" style="position:relative">${photos.busy ? `<span class="spin"></span> Saving…` : `${ICON.camera} Add photo`}<input type="file" accept="image/*" data-field="progPhoto" style="position:absolute;inset:0;opacity:0;cursor:pointer" ${photos.busy ? "disabled" : ""}></label></div></section>`;
}
A.photoDel = el => { if (confirm("Delete this photo? This can't be undone.")) photosLoad("photos/delete", {id: el.dataset.id}); };
document.addEventListener("change", async e => { const el = e.target; if (!(el.dataset && el.dataset.field === "progPhoto" && el.files[0])) return;
  if (!premiumGate("Progress photos")) return;
  photos.busy = true; render();
  try { const w = state.training.weights.at(-1); await photosLoad("photos/upload", {image: await shrinkImage(el.files[0], 1200), date: todayKey(), pose: ($("#photoPose") || {}).value, weight: w ? r1(wDisp(w.kg)) : null}); toast("Photo saved"); }
  catch (x){ photos.busy = false; toast(x.message || "Couldn't save that photo"); render(); } });
const _progW = RENDER.progress;
RENDER.progress = () => _progW() + `<section class="card stack"><div class="card-head" style="margin:0"><h2>Sleep</h2>${isPremium() ? "" : `<button class="btn sm" data-act="upgrade" data-f="Sleep tracking">${LOCK} Premium</button>`}</div>${isPremium() ? sleepCard(false) : `<p class="small muted">Log your sleep and see how it lines up with your weight, hunger and training.</p>`}</section>` + photosCard();

/* ---------- offline indicator ---------- */
function offlineBadge(){
  let el = document.getElementById("offlineBadge");
  const n = window.RR_OFFLINE ? RR_OFFLINE.pending() : 0, off = !navigator.onLine;
  if (!off && !n){ if (el) el.remove(); return; }
  if (!el){ el = document.createElement("div"); el.id = "offlineBadge"; el.className = "offline"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = off ? `Offline · ${n ? `${n} change${n === 1 ? "" : "s"} will sync when you're back online` : "you can keep logging"}` : `Syncing ${n} change${n === 1 ? "" : "s"}…`;
}
window.addEventListener("rr-queue", offlineBadge); window.addEventListener("online", offlineBadge); window.addEventListener("offline", offlineBadge);
setTimeout(offlineBadge, 1500);

/* ======================================================================
   Coach Shop: verified coaches sell programs and products. The coach is the seller;
   payments go straight to the coach's Stripe account and Rep & Ration takes a platform fee.
   ====================================================================== */
const mk = {tab:"browse", items:null, q:"", cat:"", err:"", busy:false, buys:null, sell:null, form:null, codeSent:{}};
const SELLER_TERMS = "2026-10-03";
const linkify = t => esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener nofollow">$1</a>').replace(/\n/g, "<br>");
const cents = c => money(c/100);
async function mkLoad(what){
  mk.busy = true; mk.err = "";
  try {
    if (what === "browse"){ const j = await api("market/list", {q: mk.q, cat: mk.cat}); mk.items = j.items; mk.cats = j.cats; }
    else if (what === "buys"){ mk.buys = (await api("market/purchases", {})).orders; }
    else if (what === "sell"){ mk.sell = await api("seller/me", {}); }
  } catch (e){ mk.err = e.message; if (what === "browse" && !mk.items) mk.items = []; if (what === "buys" && !mk.buys) mk.buys = []; }
  mk.busy = false; if (ui.view === "market" && !isTyping()) render();
}
async function sellerCall(route, body = {}){
  try { mk.sell = await api(route, body); render(); return true; } catch (e){ toast(e.message); return false; }
}
function V_market(){
  const u = me(), coach = !!(u && u.coach);
  const tabs = [["browse","Browse"],["buys","My purchases"],["sell","Sell"]];
  if (mk.tab === "browse" && mk.items === null && !mk.busy) mkLoad("browse");
  if (mk.tab === "buys" && mk.buys === null && !mk.busy) mkLoad("buys");
  if (mk.tab === "sell" && coach && mk.sell === null && !mk.busy) mkLoad("sell");
  const body = mk.tab === "browse" ? mkBrowse() : mk.tab === "buys" ? mkBuys() : coach ? mkSell() : `<section class="card stack"><h2>Sell your programs and gear</h2><p class="muted">Coaches and trainers on a Coach plan can sell training programs, meal plans, coaching packages, guides, apparel and equipment here. Buyers pay you directly through Stripe.</p><button class="btn primary" data-act="openPlans" style="align-self:flex-start">See Coach plans</button></section>`;
  return `<div class="pagehead"><div><h1>Coach Shop</h1><p class="sub">Programs and gear from Rep &amp; Ration coaches</p></div></div>
    <div class="seg" role="tablist" style="margin-bottom:14px">${tabs.map(([k,l]) => `<button data-act="mkTab" data-t="${k}" aria-pressed="${mk.tab === k}">${l}</button>`).join("")}</div>
    ${mk.err ? `<p class="small" style="color:var(--bad)">${esc(mk.err)}</p>` : ""}${body}`;
}
function mkBrowse(){
  const cats = mk.cats || {};
  return `<section class="card stack"><form class="row" data-form="mkSearch"><input id="mkQ" type="search" value="${esc(mk.q)}" placeholder="Search programs, plans, gear" style="flex:1;min-width:160px" aria-label="Search the shop"><button class="btn sm">Search</button></form>
    <div class="chips"><button class="chip" data-act="mkCat" data-c="" aria-pressed="${!mk.cat}">All</button>${Object.entries(cats).map(([k,l]) => `<button class="chip" data-act="mkCat" data-c="${k}" aria-pressed="${mk.cat === k}">${esc(l)}</button>`).join("")}</div></section>
    ${mk.items === null || (mk.busy && !mk.items.length) ? `<div class="loading"><span class="spin"></span> Loading the shop…</div>` : !mk.items.length ? `<section class="card"><p class="muted">Nothing here yet${mk.q || mk.cat ? " for that search" : ""}. Coaches are setting up their shops; check back soon.</p></section>`
    : `<div class="mkgrid">${mk.items.map(it => `<button class="card mkcard" data-act="mkOpen" data-id="${it.id}">${it.image ? `<img src="${it.image}" alt="" loading="lazy">` : `<span class="mkph">${ICON.cart || ""}</span>`}
        <span class="eyebrow">${esc(it.catLabel)}</span><b>${esc(it.title)}</b><span class="small muted">by ${esc(it.seller)}${it.handle ? ` · @${esc(it.handle)}` : ""}</span><span class="num"><b>${cents(it.price)}</b>${it.sales ? `<small class="muted"> · ${it.sales} sold</small>` : ""}</span></button>`).join("")}</div>`}
    <p class="small muted">Items are sold by independent coaches, not by Rep &amp; Ration. The coach handles delivery, support and refunds. <a href="/terms.html" target="_blank">Terms</a></p>`;
}
SHEETS.mkItem = d => { const it = d.it;

    <div class="row"><span class="pill neutral">${esc(it.catLabel)}</span>${it.ships ? `<span class="pill neutral">Ships to you</span>` : `<span class="pill low">Digital · instant access</span>`}<span class="spacer"></span><span class="big" style="font-size:1.6rem">${cents(it.price)}</span></div>

    <div class="row"><button class="btn primary" data-act="mkBuy" data-id="${it.id}">Buy for ${cents(it.price)}</button><button class="btn ghost sm" data-act="mkReport" data-id="${it.id}">Report</button></div>
    <p class="small muted">Checkout is handled by Stripe. Talk to your doctor before starting a new program.</p></div>`}; };
A.mkTab = el => { mk.tab = el.dataset.t; mk.err = ""; if (mk.tab === "buys") mk.buys = null; render(); };
A.mkCat = el => { mk.cat = el.dataset.c; mk.items = null; render(); };
A.mkOpen = el => { const it = (mk.items || []).find(x => x.id === el.dataset.id); if (it) openSheet("mkItem", {it}); };

document.addEventListener("submit", e => { const f = e.target.closest('[data-form="mkSearch"]'); if (!f) return; e.preventDefault(); e.stopImmediatePropagation(); mk.q = $("#mkQ").value; mk.items = null; render(); }, true);

function mkBuys(){
  if (mk.buys === null) return `<div class="loading"><span class="spin"></span> Loading your purchases…</div>`;
  if (!mk.buys.length) return `<section class="card"><p class="muted">You haven't bought anything yet.</p></section>`;
  return mk.buys.map(o => `<section class="card stack"><div class="row"><div style="flex:1"><h2>${esc(o.title)}</h2><p class="small muted">${esc(o.seller)} · ${cents(o.amount)} · ${new Date(o.at).toLocaleDateString()}${o.status === "fulfilled" ? " · delivered" : ""}</p></div>${o.image ? `<img src="${o.image}" alt="" class="mkthumb">` : ""}</div>
    ${o.delivery ? `<div class="mkdesc"><span class="eyebrow">What you get</span><br>${linkify(o.delivery)}</div>` : `<p class="small muted">The seller will ship this to the address you gave at checkout.</p>`}
    <p class="small muted">Questions or a refund? Contact the seller${o.sellerEmail ? `: <a href="mailto:${esc(o.sellerEmail)}">${esc(o.sellerEmail)}</a>` : ""}.</p></section>`).join("");
}

/* ---------- selling ---------- */
function mkSell(){
  const d = mk.sell; if (!d) return `<div class="loading"><span class="spin"></span> Loading your shop…</div>`;
  if (!d.ready) return mkOnboard(d);
  return `<section class="card stack"><div class="grid g-3 fleetstats"><div><b>${cents(d.earned)}</b><small>earned after fees</small></div><div><b>${d.orders.length}</b><small>orders</small></div><div><b>${d.listings.filter(l => l.status === "live").length}</b><small>live listings</small></div></div>
      <div class="row"><button class="btn primary" data-act="mkNew">New listing</button><a class="btn" href="https://dashboard.stripe.com/" target="_blank" rel="noopener">Payouts & refunds (Stripe)</a></div>
      <p class="small muted">Platform fee: ${d.fee}% of each sale, taken automatically. You're the seller: you handle delivery, support, refunds and taxes. <a href="/seller-terms.html" target="_blank">Seller Agreement</a></p></section>
    <section class="card stack"><h2>Your listings</h2>${d.listings.length ? `<div class="list">${d.listings.map(l => `<div class="li"><div class="main"><b>${esc(l.title)}</b><small>${cents(l.price)} · ${esc(l.catLabel)} · ${l.sales} sold · <span class="${l.status === "live" ? "" : "warn"}">${{live:"Live",pending:"In review",rejected:"Not approved",hidden:"Hidden"}[l.status] || l.status}</span>${l.reason ? ` · ${esc(l.reason)}` : ""}</small></div>
        <button class="btn sm" data-act="mkEdit" data-id="${l.id}">Edit</button>${["live","hidden"].includes(l.status) ? `<button class="btn sm ghost" data-act="mkHide" data-id="${l.id}">${l.status === "live" ? "Hide" : "Show"}</button>` : ""}<button class="btn sm danger" data-act="mkDel" data-id="${l.id}">Delete</button></div>`).join("")}</div>` : `<p class="muted">No listings yet. Add your first program or product.</p>`}</section>
    <section class="card stack"><h2>Orders</h2>${d.orders.length ? `<div class="list">${d.orders.map(o => { const a = o.shipping && o.shipping.address; return `<div class="li"><div class="main"><b>${esc(o.title)}</b><small>${esc(o.buyer || o.email || "Buyer")} · ${cents(o.amount)} (you get ${cents(o.amount - o.fee)}) · ${new Date(o.at).toLocaleDateString()}${a ? ` · Ship to ${esc([o.shipping.name, a.line1, a.line2, a.city, a.state, a.postal_code].filter(Boolean).join(", "))}` : ""}${o.email ? ` · <a href="mailto:${esc(o.email)}">${esc(o.email)}</a>` : ""}</small></div>
        ${o.status === "paid" ? `<button class="btn sm primary" data-act="mkFulfill" data-id="${o.id}">Mark delivered</button>` : `<span class="pill low">Delivered</span>`}</div>`; }).join("")}</div>` : `<p class="muted">No orders yet.</p>`}</section>`;
}
function mkOnboard(d){
  const s = d.seller || {}, st = d.steps, step = (ok, n, title, inner) => `<div class="mkstep ${ok ? "done" : ""}"><span class="mkn">${ok ? "✓" : n}</span><div style="flex:1" class="stack"><b>${title}</b>${ok ? "" : inner}</div></div>`;
  const first = !st.details ? 1 : !st.phone ? 2 : !st.email ? 3 : !st.agreement ? 4 : 5;
  return `<section class="card stack"><h2>Set up your coach shop</h2><p class="small muted">Sell programs, meal plans, coaching and gear. Buyers pay you directly through your own Stripe account. Rep &amp; Ration keeps a ${d.fee}% platform fee and isn't the seller: you're responsible for what you sell, delivery, support and refunds.</p>
    ${step(st.details, 1, "Your details", `<form class="stack" data-form="mkDetails"><label class="f">Full legal name<input id="sdLegal" type="text" autocomplete="name" value="${esc(s.legalName || "")}" required></label>
      <label class="f">Business or brand name <span class="muted">(shown to buyers, optional)</span><input id="sdBiz" type="text" autocomplete="organization" value="${esc(s.businessName || "")}"></label>
      <label class="f">Mobile phone<input id="sdPhone" type="tel" autocomplete="tel" value="${esc(s.phone || "")}" placeholder="(555) 123-4567" required></label>
      <label class="f">Email for orders<input id="sdEmail" type="email" autocomplete="email" value="${esc(s.email || me().email)}" required></label><button class="btn primary" style="align-self:flex-start">Save and continue</button></form>`)}
    ${step(st.phone, 2, "Verify your phone", first !== 2 ? "" : `<p class="small muted">We'll text a 6-digit code to ${esc(s.phone || "")}.${d.phoneOn ? "" : " (Text codes are switching on soon.)"}</p><div class="row"><button class="btn sm" data-act="mkSend" data-k="phone">${mk.codeSent.phone ? "Send again" : "Text me a code"}</button></div>
      ${mk.codeSent.phone ? `<form class="row" data-form="mkCode" data-k="phone"><input id="codephone" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Code" style="width:130px"><button class="btn sm primary">Verify</button></form>` : ""}<button class="btn sm ghost" data-act="mkEditDetails" style="align-self:flex-start">Change number</button>`)}
    ${step(st.email, 3, "Verify your email", first !== 3 ? "" : `<p class="small muted">We'll email a 6-digit code to ${esc(s.email || "")}.</p><div class="row"><button class="btn sm" data-act="mkSend" data-k="email">${mk.codeSent.email ? "Send again" : "Email me a code"}</button></div>
      ${mk.codeSent.email ? `<form class="row" data-form="mkCode" data-k="email"><input id="codeemail" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Code" style="width:130px"><button class="btn sm primary">Verify</button></form>` : ""}`)}
    ${step(st.agreement, 4, "Accept the Seller Agreement", first !== 4 ? "" : `<p class="small">In short: you are the seller and merchant of record. You alone are responsible and liable for your listings, products, programs, delivery, refunds, taxes and any claims, and you indemnify Rep &amp; Ration. No drugs, steroids, SARMs, prescription or weight-loss medications, or disease claims. We take a ${d.fee}% platform fee.</p>
      <a href="/seller-terms.html" target="_blank" class="small">Read the full Seller Agreement</a><label class="check" style="border:0;padding:0"><input type="checkbox" id="mkTerms"><span style="text-decoration:none;color:var(--ink)">I've read and agree to the Seller Agreement</span></label><button class="btn primary sm" data-act="mkAgree" style="align-self:flex-start">Accept</button>`)}
    ${step(st.payouts, 5, "Connect Stripe for payouts", first !== 5 ? "" : `<p class="small muted">Stripe verifies your identity and sends your earnings to your bank. You'll manage payouts and refunds in your own Stripe dashboard.</p><div class="row"><button class="btn primary sm" data-act="mkConnect">${s.stripe ? "Continue Stripe setup" : "Connect with Stripe"}</button>${s.stripe ? `<button class="btn sm ghost" data-act="mkRefresh">I've finished</button>` : ""}</div>`)}</section>`;
}
A.mkEditDetails = () => { mk.sell.steps.details = false; render(); };
A.mkSend = async el => { const k = el.dataset.k; el.disabled = true; try { const j = await api(`seller/${k}/send`, {}); mk.codeSent[k] = true; toast(`Code sent to ${j.to}`); render(); } catch (e){ toast(e.message); el.disabled = false; } };
A.mkAgree = () => { if (!($("#mkTerms") || {}).checked) return toast("Tick the box to accept the agreement"); sellerCall("seller/agree", {agree: true, version: SELLER_TERMS}); };
A.mkConnect = async el => { el.disabled = true; try { const j = await api("seller/connect", {}); location.href = j.url; } catch (e){ toast(e.message); el.disabled = false; } };
A.mkRefresh = () => sellerCall("seller/me");
A.mkHide = el => sellerCall("seller/listing/hide", {id: el.dataset.id});
A.mkDel = el => { if (confirm("Delete this listing? Past buyers keep what they bought.")) sellerCall("seller/listing/delete", {id: el.dataset.id}); };
A.mkFulfill = el => sellerCall("seller/order/fulfill", {id: el.dataset.id});

SHEETS.mkForm = () => { const f = mk.form, cats = mk.sell.cats || {};
  return {title: f.id ? "Edit listing" : "New listing", wide:true, body:`<form class="stack" data-form="mkSave">
    <label class="f">Type<select id="lfCat">${Object.entries(cats).map(([k,l]) => `<option value="${k}" ${f.category === k ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>

    <label class="f">What buyers get after paying <span class="muted">(only buyers see this: the program itself, a download link, or how you'll deliver it)</span><textarea id="lfDelivery" rows="5" maxlength="8000" placeholder="${f.keepDelivery ? "Leave blank to keep what you entered before" : "Week 1: …  or  https://…"}">${esc(f.delivery)}</textarea></label>
    <label class="check" style="border:0;padding:0"><input type="checkbox" id="lfShips" ${f.ships ? "checked" : ""}><span style="text-decoration:none;color:var(--ink)">This is a physical item I'll ship (collect a shipping address)</span></label>
    <label class="btn sm" style="position:relative;align-self:flex-start">${ICON.camera} Photo (optional)<input type="file" accept="image/*" id="lfImg" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
    <p class="small muted">Listings are checked automatically. No drugs, steroids, SARMs, prescription or weight-loss medications, or claims to cure or treat disease.</p>
    <button class="btn primary">${f.id ? "Save changes" : "Publish listing"}</button></form>`}; };
document.addEventListener("submit", async e => {
  const f = e.target.closest('[data-form="mkDetails"],[data-form="mkCode"],[data-form="mkSave"]'); if (!f) return; e.preventDefault(); e.stopImmediatePropagation();
  const btn = f.querySelector("button:last-of-type"); if (btn) btn.disabled = true;
  if (f.dataset.form === "mkDetails") await sellerCall("seller/start", {legal_name: $("#sdLegal").value, business_name: $("#sdBiz").value, phone: $("#sdPhone").value, email: $("#sdEmail").value});
  else if (f.dataset.form === "mkCode"){ const k = f.dataset.k; if (await sellerCall(`seller/${k}/check`, {code: $("#code" + k).value})) toast(k === "phone" ? "Phone verified" : "Email verified"); }
  else {
    const file = $("#lfImg").files[0], body = {id: mk.form.id, category: $("#lfCat").value, title: $("#lfTitle").value, price: $("#lfPrice").value, description: $("#lfDesc").value, delivery: $("#lfDelivery").value, ships: $("#lfShips").checked};
    if (mk.form.keepDelivery && !body.delivery.trim()){ const l = mk.sell.listings.find(x => x.id === mk.form.id); body.keepDelivery = true; }
    try { if (file) body.image = await shrinkImage(file, 1200); mk.sell = await api("seller/listing/save", body); const l = mk.sell.listings.find(x => x.title === body.title.trim());
      closeSheet(); render(); toast(l && l.status === "live" ? "Your listing is live" : l && l.status === "rejected" ? "Not approved: " + (l.reason || "") : "Saved. It's in review."); }
    catch (x){ toast(x.message); }
  }
  if (btn && document.body.contains(btn)) btn.disabled = false;
}, true);

    try { const per = {}; for (const s of listOf(await H.readSamples({...span, dataType:"sleep", limit:2000}))){ const st = String(s.sleepState || s.stage || s.value || "").toLowerCase(); if (/awake|inbed|in_bed/.test(st)) continue;

      <label class="f">Password<input id="gPw" type="password" autocomplete="current-password" required></label>
      <div class="gerr" id="gErr"></div><button class="btn primary">Log in</button>
      <p class="small muted"><a href="#" data-gmode="forgot">Forgot password?</a> · New here? <a href="#" data-gfree>Create a free account</a></p></form>`;
    if (mode === "forgot") return `<form class="card stack gform" data-gate="forgot"><h2>Reset your password</h2><label class="f">Email<input id="gEmail" type="email" required></label><div class="gerr" id="gErr"></div><button class="btn primary">Email me a reset link</button><p class="small muted"><a href="#" data-gmode="login">Back to log in</a></p></form>`;
    return `<form class="card stack gform" data-gate="reset"><h2>Choose a new password</h2><label class="f">New password (8+ characters)<input id="gPw" type="password" minlength="8" required></label><div class="gerr" id="gErr"></div><button class="btn primary">Save password</button></form>`;
  };
  const plansHTML = (pick) => {
    const ind = annual ? "individual_year" : "individual_month", fam = annual ? "family_year" : "family_month";
    const card = (k, title, best, items, k2) => `<div class="card gplan ${best ? "best" : ""}">${best ? `<span class="pill low" style="align-self:flex-start">Most popular</span>` : ""}<h3>${title}</h3>
      <div class="row" style="align-items:baseline"><span class="big" style="font-size:2.4rem">${P[k].price}</span><span class="muted">/${P[k].per}</span></div><p class="small muted">${P[k].note}</p>
      ${k2 ? `<p class="small">or <b>${P[k2].price}/${P[k2].per}</b> · ${P[k2].note}</p>` : ""}
      <ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>
      <button class="btn ${best ? "primary" : ""}" data-gplan="${k}">${pick ? "Choose" : "Start free trial"}</button>${k2 ? `<button class="btn sm ghost" data-gplan="${k2}">${pick ? "Choose" : "Start"} ${P[k2].n}</button>` : ""}</div>`;
    return `<div class="gtoggle"><div class="seg"><button data-gannual="0" aria-pressed="${!annual}">Monthly</button><button data-gannual="1" aria-pressed="${annual}">Annual · save up to 37%</button></div></div>
      <div class="gplans">${card(ind, "Just you", true, ["Adaptive calorie & macro targets","Barcode, photo & voice food logging","Meal plans for every diet & faith","1,700+ exercises with demos","Buddies, reminders, progress"])}
      ${card(fam, "Family", false, ["Everything in Rep & Ration","You plus 4 people, each with their own account","Meal prep & groceries scaled for the household","One bill"])}
      ${card("coach_month", "Coach", false, ["Your own full membership","Client dashboard: meals, macros, workouts, weight","Message clients in the app","Clients keep their own membership"], "coach_unlimited_month")}</div>
      <div class="card gplan gfleet"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:12px"><div style="flex:1;min-width:240px"><h3>Fleets & companies</h3><p class="small muted">Give your drivers or employees full Premium: meal plans, logging, workouts, DOT physical prep, sleep and fasting. Each person has a private account; you see who joined and who's active, never their health data. Coach tools not included.</p></div>
        <div style="text-align:right"><span class="big" style="font-size:2rem">$10</span><span class="muted">/seat/month</span><p class="small muted">20-seat minimum · <b>$8/seat</b> for 51+</p><button class="btn" data-gplan="fleet_month">${pick ? "Choose" : "Set up a fleet"}</button></div></div></div>
      <p class="small muted" style="text-align:center;margin-top:10px">7 days free on any plan · card required · cancel any time before day 8 and you pay nothing</p>`;
  };
  const freeCard = () => `<div class="card row" style="margin-top:20px;justify-content:space-between"><div style="flex:1;min-width:220px"><h3>Free</h3><p class="small muted">Log food by search, log workouts, follow your meal plan, track progress and join buddies. No card, no time limit.</p></div><div class="row"><span class="big" style="font-size:2rem">$0</span><button class="btn" data-gfree>Start free</button></div></div>`;
  function landing(){
    const feats = [["search","Log food your way","Search millions of foods from USDA and Open Food Facts, scan a barcode, snap a photo or just say what you ate."],
      ["progress","Targets that adapt","Every week we compare what you ate with your weight trend, learn your real burn and adjust your calories, like having a coach do the math."],
      ["plan","Menus for every life","Weight loss, muscle gain, keto, vegan, gluten-free and allergy-safe meals, plus halal, kosher, Daniel Fast, Lent, Ramadan and more."],
      ["workouts","1,700+ exercises","Home, calisthenics, dumbbells, kettlebells, bands and full gym, each with how-to steps and a demo. Workouts that add weight when you're ready."],
      ["cart","Budget meal plans","Set a weekly budget and get menus that fit, with cost per meal and a grocery list you can send to your cart in one tap."],
      ["truck","Built for real schedules","Shift-worker meal timing, and a trucker mode with no-kitchen meals from truck stops and cab-side workouts."],
      ["coach","Coach mode","Trainers see clients' meals, macros, workouts and weight in one dashboard and message them in the app."],
      ["buddies","Family & buddies","One family plan for the whole house, plus groups to cheer on friends and co-workers."],
      ["bell","Reminders & app install","Add it to your home screen like an app, with reminders for meals, workouts and weigh-ins."]];
    return `<div class="gnav">${logo}<div class="row"><a class="btn sm ghost ghelp" href="/support.html">Help</a><button class="btn sm" data-gmode="login">Log in</button><button class="btn sm primary" data-gfree>Start free</button></div></div>
      <div class="ghero"><div><span class="eyebrow">Calorie counter · meal planner · workout app</span><h1>Train it. Eat it. <span>Track both.</span></h1>
        <p class="lead">One app that plans your meals and workouts around your goal, learns your real metabolism every week, and fits your budget, your faith and your schedule.</p>
        <div class="gcta"><button class="btn primary" data-gfree>Start free</button><button class="btn" data-gscroll>Try Premium free for 7 days</button></div>
        <div class="gpoints"><span>Free plan, no card</span><span>Premium from $10/month billed yearly</span><span>Cancel any time</span></div></div>
        <div class="gphone"><span class="eyebrow">Today</span>
          <div class="tile">${ic("nutrition")}<div><b>1,840 kcal target</b><small>Adapted from your last 3 weeks</small></div></div>
          <div class="tile">${ic("scan")}<div><b>Scan, snap or say it</b><small>"2 eggs, toast and coffee"</small></div></div>
          <div class="tile">${ic("workouts")}<div><b>Upper strength · 45 min</b><small>Bench press: add 5 lb today</small></div></div>
          <div class="tile">${ic("cart")}<div><b>Groceries for the week</b><small>About $64 for 2 people</small></div></div></div></div>
      <div class="gsec"><h2>Everything in one membership</h2><p>No separate calorie counter, workout app and meal planner. It's all here, and it all works together.</p>
        <div class="gfeat">${feats.map(f => `<div class="card">${ic(f[0])}<h3>${f[1]}</h3><p class="small muted">${f[2]}</p></div>`).join("")}</div>
        <div class="gwho">${["Weight loss","Muscle gain","Keto & low-carb","Vegan & vegetarian","Food allergies","Halal","Kosher","Daniel Fast","Ramadan","Lent","Truckers","Night shift","Families","Personal trainers","Busy parents","On a budget"].map(x => `<span>${x}</span>`).join("")}</div></div>
      <div class="gsec" id="gPlans"><h2>Simple pricing</h2><p>Use the free plan as long as you like. Premium plans start with 7 days free.</p>${freeCard()}${plansHTML(false)}</div>
      <div id="gForm">${form(gmode)}</div>${foot}`;
  }
  function show(view, u){
    const g = $g("#gate"), b = $g("#gateBody"); g.hidden = false;
    if (view === "landing") b.innerHTML = landing();
    else if (view === "reset") b.innerHTML = `<div class="gnav">${logo}</div>${form("reset")}${foot}`;
    else b.innerHTML = `<div class="gnav">${logo}<button class="btn sm" data-glogout>Log out</button></div>
      <div class="gsec"><h2>${u.sub.canTrial ? "Pick a plan to start your free trial" : "Welcome back. Pick a plan to reactivate"}</h2><p>${u.sub.canTrial ? "Nothing is charged today. After 7 days your card is billed for the plan you choose. Cancel any time before then and you pay nothing." : "Your subscription isn't active. Choose a plan to get back to your plan, logs and groups."}</p>
      <div class="gerr" id="gErr" style="text-align:center"></div>${plansHTML(true)}</div>
      <p class="small muted" style="text-align:center">Payments are handled securely by Stripe. Added to a family plan? Make sure you signed up with the email the plan owner added.</p>${foot}`;
  }
  const err = m => { const e = $g("#gErr"); if (e) e.textContent = m; };
  let fleetInfo = {};
  async function checkout(){ try { const j = await RR_API("billing/checkout", Object.assign({plan}, plan === "fleet_month" ? fleetInfo : {})); location.href = j.url; } catch (e){ err(e.message); } }
  document.addEventListener("input", e => { if (e.target.id === "gSeats"){ const n = Math.round(+e.target.value || 0), u = n > 50 ? 8 : 10, t = $g("#gSeatTotal"); if (t) t.textContent = n < 20 ? "Fleet plans start at 20 seats." : `${n} seats × $${u} = $${(n*u).toLocaleString()}/month. Your own access is included.`; } });
  let mode = "landing";
  document.addEventListener("click", async e => {
    if (!e.target.closest("#gate")) return;
    const m = e.target.closest("[data-gmode]"); if (m){ e.preventDefault(); gmode = m.dataset.gmode; const f = $g("#gForm"); if (f){ f.innerHTML = form(gmode); f.scrollIntoView({behavior:"smooth", block:"center"}); } else show("landing"); return; }
    if (e.target.closest("[data-gfree]")){ freeSignup = true; gmode = "signup"; const f = $g("#gForm"); f.innerHTML = form("signup"); f.scrollIntoView({behavior:"smooth", block:"center"}); return; }
    if (e.target.closest("[data-gscroll]")){ const t = $g("#gPlans"); if (t) t.scrollIntoView({behavior:"smooth"}); return; }
    const a = e.target.closest("[data-gannual]"); if (a){ annual = a.dataset.gannual === "1"; plan = annual ? plan.replace("_month", "_year").replace("coach_year", "coach_month").replace("coach_unlimited_year", "coach_unlimited_month").replace("fleet_year", "fleet_month") : plan.replace("_year", "_month"); if (mode === "paywall") show("paywall", window.RR_USER); else { const y = scrollY; show("landing"); scrollTo(0, y); } return; }
    const p = e.target.closest("[data-gplan]"); if (p){ plan = p.dataset.gplan; freeSignup = false; if (mode === "paywall"){ p.disabled = true; return checkout(); } gmode = "signup"; const f = $g("#gForm"); f.innerHTML = form("signup"); f.scrollIntoView({behavior:"smooth", block:"center"}); setTimeout(() => { const n = $g("#gName"); if (n) n.focus({preventScroll:true}); }, 400); return; }
    if (e.target.closest("[data-glogout]")) { await RR_API("auth/logout", {}).catch(() => {}); location.href = "/"; }
  });
  document.addEventListener("submit", async e => {
    const f = e.target.closest("[data-gate]"); if (!f) return; e.preventDefault();
    const t = f.dataset.gate, v = id => ($g(id) || {}).value || "";
    const btn = f.querySelector("button"); btn.disabled = true; err("");
    try {
      if (t === "signup"){
        if (plan === "fleet_month" && !freeSignup){ fleetInfo = {company: v("#gCo").trim(), seats: Math.round(+v("#gSeats"))}; if (fleetInfo.company.length < 2) throw new Error("Enter your company name."); if (!(fleetInfo.seats >= 20)) throw new Error("Fleet plans start at 20 seats."); }
        const j = await RR_API("auth/signup", {name: v("#gName"), email: v("#gEmail"), password: v("#gPw")});
        if (freeSignup && v("#gCode").trim()){ try { await RR_API("fleet/join", {code: v("#gCode")}); } catch (x){ alert(x.message + " You can enter the code later under Profile → Account."); } }
        if (!freeSignup && j.user.sub.billing && !j.user.sub.active) return checkout(); location.href = "/"; }
      else if (t === "login"){ await RR_API("auth/login", {email: v("#gEmail"), password: v("#gPw")}); location.href = "/"; }
      else if (t === "forgot"){ await RR_API("auth/reset-request", {email: v("#gEmail")}); err("If that email has an account, a reset link is on its way."); }
      else if (t === "reset"){ await RR_API("auth/reset", {token: new URLSearchParams(location.search).get("reset"), password: v("#gPw")}); location.href = "/?reset=done"; }
    } catch (x){ err(x.message); }
    btn.disabled = false;
  });
  window.RR_ME.then(u => {
    window.RR_USER = u;
    const qs = new URLSearchParams(location.search);
    if (qs.get("reset") && qs.get("reset") !== "done") return show("reset");
    if (!u){ mode = "landing"; return show("landing"); }
    if (qs.get("checkout") === "success") setTimeout(() => { try { toast("You're in. Your free trial has started."); } catch {} }, 800);
    if (qs.has("checkout") || qs.has("reset") || qs.has("plan")) history.replaceState(null, "", "/" + location.hash);
  });
})();
</script>

</body></html>
