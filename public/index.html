<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rep & Ration builds your meals and workouts around your goal, tracks every rep and every plate, and keeps your crew in it with you.">
<meta name="theme-color" content="#0B7A5E">
<meta property="og:title" content="Rep & Ration"><meta property="og:description" content="Train it. Eat it. Track both. 7-day free trial.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='8' fill='%230B7A5E'/%3E%3Cpath d='M8 10v10M11 12v6M22 10v10M19 12v6M11 15h8' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<script>window.RR_PUBLIC = true;
(function(){
  const api = async (route, body) => {
    const r = await fetch("/api/" + route, {method: body === undefined ? "GET" : "POST", headers: {"content-type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body), credentials: "same-origin"});
    const j = await r.json().catch(() => ({}));
    if (!r.ok){ const e = new Error(j.error || ("HTTP " + r.status)); e.status = r.status; e.code = r.status === 413 ? "invalid_argument" : r.status === 403 ? "invalid_argument" : "unavailable"; throw e; }
    return j;
  };
  window.RR_API = api;
  const ready = api("me").then(j => (window.RR_USER = j.user)).catch(() => null);
  window.RR_ME = ready;
  const listeners = new Set(), refresh = () => listeners.forEach(f => f());
  setInterval(refresh, 10000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  const snap = (id, exists, data) => ({id, exists, data: () => data === undefined ? undefined : JSON.parse(JSON.stringify(data)), metadata: {fromCache: false, hasPendingWrites: false}});
  const doc = path => ({
    id: path.split("/").pop(), path,
    get: async () => { const j = await api("db", {op: "get", path}); return snap(path.split("/").pop(), !!j.exists, j.data); },
    set: async data => { const j = await api("db", {op: "set", path, data}); setTimeout(refresh, 50); return j; },
    update: async data => { await api("db", {op: "update", path, data}); setTimeout(refresh, 50); },
    delete: async () => { await api("db", {op: "delete", path}); setTimeout(refresh, 50); },
    acquire: async () => ({acquired: true}),
    onSnapshot: (next, err) => { let last; const f = () => doc(path).get().then(s => { const k = JSON.stringify([s.exists, s.data()]); if (k !== last){ last = k; next(s); } }).catch(e => err && err(e)); listeners.add(f); f(); return () => listeners.delete(f); },
    collection: sub => coll(path + "/" + sub)
  });
  const coll = (path, filter) => ({
    path,
    where: (f, op, v) => coll(path, [f, op, v]),
    orderBy(){ return this; }, limit(){ return this; },
    get: async () => { const j = await api("db", {op: "query", collection: path, where: filter || []}); const docs = j.docs.map(d => snap(d.id, true, d.data)); return {docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: {}}; },
    onSnapshot(next, err){ let last; const f = () => this.get().then(q => { const k = JSON.stringify(q.docs.map(d => [d.id, d.data()])); if (k !== last){ last = k; next(q); } }).catch(e => err && err(e)); listeners.add(f); f(); return () => listeners.delete(f); },
    doc: id => doc(path + "/" + (id || Math.random().toString(36).slice(2)))
  });
  const db = {doc, collection: p => coll(p)};
  const names = {};
  const user = {
    id: async () => { const u = await ready; return u ? u.id : null; },
    me: async () => { const u = await ready; return {id: u ? u.id : null, name: u ? u.name : "", email: u ? u.email : null, avatarUrl: "", color: "#0B7A5E", isOwner: false, canEdit: false}; },
    isOwner: async () => false, canEdit: async () => false, can: async () => null,
    profiles: async ids => {
      ids = [].concat(ids); const u = await ready; const need = ids.filter(i => !(i in names));
      if (need.length){ try { const j = await api("profiles", {ids: need}); for (const i of need) names[i] = j.names[i] || ""; } catch {} }
      return Object.fromEntries(ids.map(i => [i, {id: i, name: u && i === u.id ? (u.name || "You") : (names[i] || ""), avatarUrl: "", color: "#0B7A5E", email: null, isMe: !!u && i === u.id}]));
    },
    search: async () => []
  };
  window.claude = {use: async name => { const u = await ready; if (!u || !u.sub.active) return null; return name === "db" ? db : name === "user" ? user : null; }};
})();
</script>
<title>Rep &amp; Ration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: SaaS app shell — fixed left rail on desktop, bottom tab bar on phones; content is a 12-col-ish card grid. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface-2:#E8EDEA; --ink:#12201B; --muted:#5A6A64; --line:#D5DDD9;
  --accent:#0B7A5E; --accent-ink:#FFFFFF; --accent-soft:#D8EEE6; --accent-strong:#075A45;
  --protein:#3867D6; --carbs:#D9961A; --fat:#C24C78; --sugar:#7B58D0;
  --good:#1E8A57; --warn:#B97C0C; --bad:#C23E36; --good-soft:#DDF1E6; --warn-soft:#F8ECD2; --bad-soft:#F6DEDC;
  --shadow:0 1px 2px rgba(18,32,27,.05),0 6px 20px -12px rgba(18,32,27,.18);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1210; --surface:#141C19; --surface-2:#1B2622; --ink:#E5EEEA; --muted:#93A59F; --line:#27342F;
  --accent:#35C18F; --accent-ink:#04130D; --accent-soft:#143429; --accent-strong:#6FE0B6;
  --protein:#7098FF; --carbs:#F0BB4A; --fat:#EB7FA7; --sugar:#A88CF7;
  --good:#43C986; --warn:#E6AE3A; --bad:#F0716A; --good-soft:#12301F; --warn-soft:#352812; --bad-soft:#3A1715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1210; --surface:#141C19; --surface-2:#1B2622; --ink:#E5EEEA; --muted:#93A59F; --line:#27342F;
  --accent:#35C18F; --accent-ink:#04130D; --accent-soft:#143429; --accent-strong:#6FE0B6;
  --protein:#7098FF; --carbs:#F0BB4A; --fat:#EB7FA7; --sugar:#A88CF7;
  --good:#43C986; --warn:#E6AE3A; --bad:#F0716A; --good-soft:#12301F; --warn-soft:#352812; --bad-soft:#3A1715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-variation-settings:"wdth" 108;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800;line-height:1.15}
h2{font-size:1.08rem;font-weight:750}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-variation-settings:"wdth" 118;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;background:none;border:0;cursor:pointer}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-variation-settings:"wdth" 120;font-weight:900;font-size:1.15rem;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:9px 12px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;text-align:left}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.sync{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}
.topbar,.tabbar{display:none}
main{padding-block:28px 60px;padding-inline:32px;min-width:0}
.wrap{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead .sub{color:var(--muted);margin-top:4px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-dash{grid-template-columns:1.25fr 1fr 1fr}
.g-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.divider{height:1px;background:var(--line);margin:4px 0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:10px;font-weight:650;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 11px;font-size:.85rem;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn.icon{padding:6px;width:32px;height:32px}
.btn svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;border-radius:8px;font-weight:650;font-size:.88rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:650;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=search],select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:.95rem;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
input[type=number]{font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:750;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.pill.low{background:var(--good-soft);color:var(--good)}
.pill.med{background:var(--warn-soft);color:var(--warn)}
.pill.high{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.tag{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}

/* banner, toast */
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--r);padding:14px 18px}
.banner p{color:var(--ink);max-width:70ch}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* dashboard pieces */
.ringwrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.macros{display:flex;flex-direction:column;gap:11px;flex:1;min-width:190px}
.mbar .top{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:4px}
.mbar .top b{font-weight:650}
.track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-weight:650;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface)}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wday .d{font-size:.72rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wday .w{font-size:.8rem;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;color:var(--muted)}
.status.done{color:var(--good)}
.status svg{width:13px;height:13px}
.minibar{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.minibar i{display:block;height:100%}

/* meals */
.meal{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface);min-width:0}
.meal .slot{font-size:.72rem;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-strong)}
.meal ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.87rem}
.meal li{display:flex;justify-content:space-between;gap:10px}
.meal li span:last-child{color:var(--muted);white-space:nowrap}
.macroline{display:flex;gap:12px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.macroline b{font-weight:700}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:1px}
.daytabs{display:flex;gap:6px;flex-wrap:wrap}
.daytabs button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:650;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:58px}
.daytabs button small{font-size:.72rem;color:var(--muted);font-weight:500}
.daytabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.daytabs button[aria-pressed="true"] small{color:var(--bg);opacity:.75}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis}
.li .main small{color:var(--muted);font-size:.8rem}
.li .kc{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mealgroup h3{display:flex;justify-content:space-between;padding:12px 0 4px;border-bottom:1px solid var(--line)}
.mealgroup h3 span{color:var(--muted);font-weight:600;font-family:var(--f-body);font-size:.85rem}
.empty{padding:14px 0;color:var(--muted);font-size:.88rem}
.check{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:.92rem}
.check input{width:17px;height:17px;accent-color:var(--accent);flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
.check small{margin-left:auto;color:var(--muted);text-align:right}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}

/* workouts */
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ex{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.ex .cue{font-size:.84rem;color:var(--muted);flex:1}
.ex .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sday{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px;min-width:0}
.sday.rest{background:var(--surface-2)}
.sitem{display:grid;grid-template-columns:minmax(0,1fr) 52px 60px 30px;gap:6px;align-items:center;font-size:.87rem}
.sitem input{padding:5px 6px;text-align:center;font-size:.85rem}
.sitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1}
.sitem .x:hover{color:var(--bad)}
.sethead{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.logex{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.setrow{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.setrow.nl{grid-template-columns:40px minmax(0,1fr) 44px}
.setrow .n{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tick{width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.tick svg{width:18px;height:18px}

/* bmi */
.bmiscale{position:relative;height:12px;border-radius:99px;display:flex;overflow:hidden;margin-top:26px}
.bmiscale i{display:block;height:100%}
.bmimark{position:absolute;top:-24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:.75rem;font-weight:750;font-variant-numeric:tabular-nums}
.bmimark::after{content:"";width:2px;height:22px;background:var(--ink);margin-top:2px}
.bmiwrap{position:relative;padding-top:4px}
.bmilabels{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.note{font-size:.8rem;color:var(--muted);max-width:70ch}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:.88rem}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:40px 0}

/* menus, suggestions, buddies */
.src{display:inline-flex;align-self:flex-start;font-size:.72rem;font-weight:650;color:var(--accent-strong);background:var(--accent-soft);border-radius:999px;padding:2px 9px;text-decoration:none}
.src:hover{text-decoration:underline}
details.how summary{cursor:pointer;font-size:.82rem;font-weight:650;color:var(--muted)}
details.how .steps{margin-top:8px;font-size:.85rem}
textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;resize:vertical}
.who{display:inline-flex;align-items:center;gap:8px;min-width:0}
.who img,.who i{width:28px;height:28px;border-radius:50%;flex:none;background:var(--surface-2);object-fit:cover}
.who b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed{display:flex;flex-direction:column}
.fev{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.fev:last-child{border-bottom:0}
.fev p{margin:0;font-size:.92rem}
.codebox{border:1px dashed var(--accent);border-radius:12px;padding:6px 14px;text-align:center;background:var(--accent-soft)}
.codebox b{display:block;font-family:var(--f-display);font-size:1.4rem;letter-spacing:.18em;color:var(--accent-strong)}
.note a{color:var(--accent-strong)}
.navbadge{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:.7rem;padding:0 7px;font-weight:750}
/* devices & coach */
.vitals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vital{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--surface);min-width:0}
.coachmsg{border-radius:12px;padding:12px 14px;background:var(--accent-soft);border-left:4px solid var(--accent)}
.coachmsg.l2{background:var(--warn-soft);border-left-color:var(--warn)}
.coachmsg.l3{background:var(--bad-soft);border-left-color:var(--bad)}
.coachmsg ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.coachpop{position:fixed;top:16px;right:16px;z-index:60;max-width:min(420px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:none;flex-direction:column;gap:8px}
.coachpop.show{display:flex}.coachpop.l2{border-left-color:var(--warn)}.coachpop.l3{border-left-color:var(--bad)}
.coachpop ul{margin:0;padding-left:18px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.devgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.devbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.devbtn small{color:var(--muted)}
.devbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stepbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:140px;align-items:end;margin-top:8px}
.stepbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;font-size:.72rem;color:var(--muted)}
.stepbars i{display:block;width:70%;background:var(--accent);border-radius:6px 6px 0 0}
code{font-size:.8rem;background:var(--surface-2);padding:1px 5px;border-radius:5px}
@media (max-width:1100px){.g-dash{grid-template-columns:1fr 1fr}.g-dash>:first-child{grid-column:1/-1}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-size:.68rem;font-weight:650;color:var(--muted);padding:4px 0;cursor:pointer}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--accent-strong)}
  main{padding-inline:16px;padding-block:18px 100px}
  h1{font-size:1.4rem}
  .g-3,.g-2,.g-dash,.g-side{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(7,minmax(74px,1fr));overflow-x:auto;padding-bottom:4px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const ACT = {sedentary:[1.2,"Sedentary","Desk job, little exercise"],light:[1.375,"Lightly active","Exercise 1–3 days/week"],moderate:[1.55,"Moderately active","Exercise 3–5 days/week"],very:[1.725,"Very active","Hard training 6–7 days or a physical job"]};
const GOALS = {loss:"Fat loss",gain:"Muscle gain",maintain:"Maintenance"};
function calc(p){
  const h = p.heightCm/100, w = p.weightKg;
  const bmi = w/(h*h);
  const cat = bmi < 18.5 ? ["Underweight","warn"] : bmi < 25 ? ["Healthy weight","good"] : bmi < 30 ? ["Overweight","warn"] : ["Obesity","bad"];
  const bmr = 10*w + 6.25*p.heightCm - 5*p.age + (p.sex === "male" ? 5 : -161);
  const tdee = bmr * ACT[p.activity][0];
  let target = tdee, adj = 0;
  if (p.goal === "loss") adj = -Math.min(tdee*0.20, 750);
  if (p.goal === "gain") adj = Math.min(tdee*0.10, 350);
  target = tdee + adj;
  const floor = p.sex === "male" ? 1500 : 1200;
  const floored = target < floor;
  target = Math.round(Math.max(target, floor)/10)*10;
  const basis = bmi >= 30 ? 25*h*h : w; // protein from a reference weight when BMI ≥ 30
  const pk = {loss:2.0, gain:1.8, maintain:1.6}[p.goal];
  const protein = Math.round(basis*pk);
  const fatPct = p.goal === "maintain" ? .30 : .25;
  const fat = Math.round(Math.max(target*fatPct/9, w*0.6));
  const carbs = Math.max(50, Math.round((target - protein*4 - fat*9)/4));
  const addedSugar = Math.round(target*0.10/4);
  const fiber = Math.round(target/1000*14);
  return {bmi, cat, bmr, tdee, adj, target, floored, protein, fat, carbs, addedSugar, fiber, lo:18.5*h*h, hi:24.9*h*h, proteinBasis: bmi>=30};
}

function mealTotals(items){ const t={kcal:0,p:0,c:0,f:0,s:0,as:0}; for(const [id,q] of items){ const f=FOOD[id]; for(const k in t) t[k]+=f[k]*q; } return t; }
const roundQ = q => Math.max(0.25, Math.round(q*4)/4);
function generatePlan(p){
  const c = calc(p);

  const days = [];
  const pools = {};
  for (const [slot] of SLOTS) pools[slot] = shuffle(mealPool(slot, p), rnd);
  for (let d=0; d<7; d++){
    const meals = SLOTS.map(([slot,share]) => {
      const pool = pools[slot];
      const tpl = pool[(d + (slot==="Dinner"?2:0)) % pool.length];
      const base = mealTotals(tpl.items);
      const k = clamp((c.target*share)/base.kcal, 0.6, 2.4);
      const items = tpl.items.map(([id,q]) => [id, roundQ(q*k)]);
      return {slot, tpl:tpl.id, src:tpl.src, steps:tpl.steps, name:tpl.name, items, t:mealTotals(items)};
    });
    const t = meals.reduce((a,m)=>{for(const k in a)a[k]+=m.t[k];return a;},{kcal:0,p:0,c:0,f:0,s:0,as:0});

}

function groceries(plan, from=0, to=7){

const DAY_PATTERNS = {2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5]};
function buildWeek(p, seed){
  const rnd = mulberry32(seed*31+7);
  const pool = EXS.filter(e => e.impact <= p.impact && exAvailable(e, p.equipment));
  const by = pat => shuffle(pool.filter(e => e.pattern===pat), rnd).sort((a,b) => (b.loaded - a.loaded)*(p.goal==="gain"?1:0));
  const lists = {lower:by("lower"),push:by("push"),pull:by("pull"),core:by("core"),cardio:by("cardio")};
  const cursor = {lower:0,push:0,pull:0,core:0,cardio:0};
  const take = pat => { const l = lists[pat]; if(!l.length) return null; const e = l[cursor[pat] % l.length]; cursor[pat]++; return e; };
  const dose = (e, sets) => ({ex:e.id, sets, reps: e.metric==="time" ? (p.goal==="loss" ? Math.max(e.dose,40) : e.dose) : (p.goal==="gain" && e.loaded ? 10 : p.goal==="loss" ? Math.round(e.dose*1.15) : e.dose)});
  const week = Array(7).fill(null);
  const idx = DAY_PATTERNS[clamp(p.daysPerWeek,2,6)];
  idx.forEach((d,i) => {
    let name, pats, sets;
    if (p.goal === "gain"){
      const upper = i % 2 === 0;
      name = upper ? "Upper strength" : "Lower strength";
      pats = upper ? ["push","pull","push","pull","core"] : ["lower","lower","lower","core","lower"];
      sets = 4;
    } else if (p.goal === "loss"){
      name = "Full-body burn circuit"; pats = ["lower","push","pull","core","cardio","cardio"]; sets = 3;
    } else { name = "Full-body strength"; pats = ["lower","push","pull","core","cardio"]; sets = 3; }
    const items = []; const used = new Set();
    for (const pat of pats){ let e = take(pat), tries = 0; while (e && used.has(e.id) && tries < 6){ e = take(pat); tries++; } if (e && !used.has(e.id)){ used.add(e.id); items.push(dose(e,sets)); } }
    week[d] = {name, items};
  });
  return week;
}
const estMinutes = day => day ? Math.round(day.items.reduce((a,it)=>{ const e=EX[it.ex]; const work = e.metric==="time"? it.reps : it.reps*3; return a + it.sets*(work+45); },0)/60) : 0;

function niceTicks(min, max, n=4){
  if (min===max){ min -= 1; max += 1; }
  const raw = (max-min)/n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw/mag;
  const step = (norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step, t = [];
  for (let v=lo; v<=hi+step/2; v+=step) t.push(Math.round(v*1000)/1000);
  return {lo, hi, t};
}
function lineChart(series, opt={}){
  const W=640, H=opt.h||220, L=46, R=16, T=14, B=28;
  const all = series.flatMap(s=>s.pts); if (all.length < 2) return `<p class="empty">Log at least two entries to see a trend.</p>`;
  const xs = all.map(p=>p[0]), ys = all.map(p=>p[1]).concat(opt.extraY||[]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs); const pad = (Math.max(...ys)-Math.min(...ys))*0.08 || 1;
  const {lo, hi, t} = niceTicks(Math.min(...ys)-pad, Math.max(...ys)+pad, 4);
  const X = x => L + (x1===x0 ? (W-L-R)/2 : (x-x0)/(x1-x0)*(W-L-R)), Y = y => T + (1-(y-lo)/(hi-lo))*(H-T-B);
  let g = "";
  for (const v of t) g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${fmt1(v)}</text>`;
  const xt = [x0, x0+(x1-x0)/2, x1];
  xt.forEach((x,i) => { const d = new Date(x); g += `<text x="${X(x)}" y="${H-8}" text-anchor="${i===0?"start":i===2?"end":"middle"}">${MON[d.getMonth()]} ${d.getDate()}</text>`; });
  for (const s of series){
    if (s.pts.length < 1) continue;
    const d = s.pts.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" ");
    if (s.area) g += `<path d="${d} L${X(s.pts.at(-1)[0])} ${H-B} L${X(s.pts[0][0])} ${H-B} Z" fill="${s.color}" opacity=".10"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" ${s.dash?`stroke-dasharray="${s.dash}"`:""} stroke-linejoin="round" stroke-linecap="round" ${s.faint?'opacity=".45"':""}/>`;
    if (s.dots) for (const p of s.pts) g += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.4" fill="${s.color}" opacity=".55"/>`;
    if (s.end){ const p = s.pts.at(-1); g += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="5" fill="var(--surface)" stroke="${s.color}" stroke-width="2.5"/>`; }
  }
  if (opt.hline != null && opt.hline >= lo && opt.hline <= hi) g += `<line x1="${L}" x2="${W-R}" y1="${Y(opt.hline)}" y2="${Y(opt.hline)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||"Trend chart")}">${g}</svg>`;
}
function calBars(target){
  const W=640,H=200,L=46,R=12,T=14,B=28, days=[];
  for (let i=6;i>=0;i--){ const k = dkey(addDays(new Date(),-i)); days.push([k, dayTotals(k).kcal]); }
  const {lo,hi,t} = niceTicks(0, Math.max(target*1.2, ...days.map(d=>d[1])), 4);
  const Y = y => T + (1-(y-lo)/(hi-lo))*(H-T-B), bw = (W-L-R)/7;
  let g = "";
  for (const v of t) g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  days.forEach(([k,v],i) => { const x = L + i*bw + bw*0.22, w = bw*0.56, over = v > target*1.05; const col = v===0 ? "var(--surface-2)" : over ? "var(--warn)" : "var(--accent)";
    g += `<rect x="${x}" y="${Y(Math.max(v,0))}" width="${w}" height="${Math.max(0,Y(0)-Y(v))}" rx="4" fill="${col}"/><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${DAYS[wIdx(pkey(k))]}</text>`; });
  g += `<line x1="${L}" x2="${W-R}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${Y(target)-6}" text-anchor="end">Target ${fmt(target)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories for the last 7 days">${g}</svg>`;
}
function ring(val, max, big, small){
  const r=62, C=2*Math.PI*r, pct = clamp(val/max,0,1), over = val > max;
  return `<div class="ring"><svg viewBox="0 0 148 148" aria-hidden="true"><circle cx="74" cy="74" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="74" cy="74" r="${r}" fill="none" stroke="${over?"var(--warn)":"var(--accent)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}"/></svg><div class="center"><span class="big" style="font-size:1.9rem">${big}</span><span class="small muted">${small}</span></div></div>`;
}
function mbar(label, color, val, target, unit="g", isCap=false){
  const pct = target ? clamp(val/target*100,0,100) : 0, over = isCap && val > target;
  return `<div class="mbar"><div class="top"><b><span class="sw" style="background:${color}"></span>${label}</b><span class="num ${over?"":"muted"}" ${over?'style="color:var(--bad);font-weight:700"':""}>${fmt(val)} / ${fmt(target)} ${unit}${isCap?" max":""}</span></div><div class="track"><i style="width:${pct}%;background:${over?"var(--bad)":color}"></i></div></div>`;
}
function macroBlock(t, c){
  return `<div class="macros">${mbar("Protein","var(--protein)",t.p,c.protein)}${mbar("Carbs","var(--carbs)",t.c,c.carbs)}${mbar("Fat","var(--fat)",t.f,c.fat)}${mbar("Added sugar","var(--sugar)",t.as,c.addedSugar,"g",true)}<p class="small muted">Total sugars ${fmt(t.s)} g, including natural sugar from fruit and dairy.</p></div>`;
}
const macroLine = t => `<div class="macroline num"><span><span class="sw" style="background:var(--protein)"></span><b>${fmt(t.p)}</b> P</span><span><span class="sw" style="background:var(--carbs)"></span><b>${fmt(t.c)}</b> C</span><span><span class="sw" style="background:var(--fat)"></span><b>${fmt(t.f)}</b> F</span><span><span class="sw" style="background:var(--sugar)"></span><b>${fmt(t.s)}</b> sugar</span></div>`;

function rrSetupSubmit(){

  if (!sex || !(age >= 14 && age <= 100) || !(hcm >= 100 && hcm <= 250) || !(w > 0)) { toast("Please fill in sex, age, height and weight."); return; }
  const p = Object.assign(defaultProfile(), {name: (v("#ws-name") || "").trim(), sex, age, units, heightCm: hcm, weightKg: units === "us" ? w / 2.20462 : w, activity: v("#ws-act"), goal: v("#ws-goal"), planSeed: 1 + Math.floor(Math.random() * 999), startDate: todayKey()});

function suggestMeals(slot){
  const p = state.profile, c = calc(p), t = dayTotals(ui.nutDate);
  const remK = c.target - t.kcal, remP = c.protein - t.p;
  const share = (SLOTS.find(s => s[0] === slot) || [0, .3])[1];
  const budget = clamp(remK > 0 ? Math.min(remK, c.target*share*1.35) : c.target*share*0.6, 150, 1100);
  const scored = mealPool(slot, p).map(tpl => {
    const base = mealTotals(tpl.items), k = clamp(budget/base.kcal, 0.5, 2);
    const items = tpl.items.map(([id,q]) => [id, roundQ(q*k)]), tt = mealTotals(items);
    const needP = remP > 0 ? remP*budget/Math.max(remK, budget) : 0;
    const score = Math.abs(tt.kcal - budget)/budget + (needP ? Math.max(0, 1 - tt.p/needP)*0.8 : 0) + (tt.as > c.addedSugar*0.3 ? 0.3 : 0);
    return {tpl, items, t:tt, score};
  }).sort((a,b) => a.score - b.score);
  return {remK, remP, list: scored.slice(0, 4)};
}

/* ---------------- devices, vitals & health coach ----------------
   Private per person: data/users/{uid}/health
   {devices[], hr[[t,bpm]] 5-min averages · 7 days, rhr{day}, hrv{day}, steps{day}, stepsHr{"day Hh"}, bp[[t,sys,dia]] · 90 days,
    sleep{day:hours}, stress[[t,0-100]], spo2[[t,%]], water{day:glasses}, alerts{prefs, sent{key:t}, log[]}}
   Sources today: Apple Health export, Samsung Health export, Bluetooth heart-rate devices (where the browser allows) and manual entry.
   The coach rules below use published thresholds (AHA blood-pressure categories, CDC 7+ hours of sleep, HRmax = 208 − 0.7 × age). */
const DEVICE_KINDS = {
  apple:{name:"Apple Watch", via:"Apple Health", how:"On your iPhone open Health → your photo → Export All Health Data, then upload the export.zip (or the export.xml inside it) here.", live:"Continuous background sync needs the Rep & Ration iPhone companion app, which reads Apple Health with your permission."},
  samsung:{name:"Samsung Galaxy Watch", via:"Samsung Health", how:"In Samsung Health open ⋮ → Settings → Download personal data. Upload the CSV files it saves (heart rate, steps, blood pressure, stress, sleep).", live:"Continuous background sync needs the Rep & Ration Android companion app, which reads Health Connect with your permission."},
  ble:{name:"Bluetooth heart-rate monitor", via:"Bluetooth", how:"Works with chest straps and watches that broadcast heart rate (Polar, Garmin, Wahoo, Coros and others) in Chrome on Android, Windows and Mac.", live:"Live while this page is open."},
  pixel:{name:"Google Pixel Watch / Fitbit", via:"CSV import", how:"Export your data from Fitbit or Google Takeout, then import it with the Rep & Ration CSV format below.", live:"Direct account sync is planned through a health-data service."},
  garmin:{name:"Garmin, Oura or Whoop", via:"CSV import", how:"Export your data from the device's app, then import it with the Rep & Ration CSV format below.", live:"Direct account sync is planned through a health-data service."},
  cuff:{name:"Blood-pressure cuff", via:"Manual or CSV", how:"Enter each reading after you measure, or import a CSV from Withings, Omron or similar.", live:"Readings appear as soon as you save them."},
  meta:{name:"Meta AI glasses", via:"Voice & photo", how:"The glasses have no heart-rate or blood-pressure sensors. Use them hands-free: ask Meta AI to take a photo of your plate or read out today's plan, then log it here.", live:"No health data to sync."}
};
const COACH_CATS = [["activity","Steps & movement"],["hydration","Water"],["recovery","Rest & sleep"],["heart","Heart rate"],["bp","Blood pressure"],["stress","Stress"],["workout","Workout reminders"]];
const DAY_MS = 864e5, H_MS = 36e5;
function freshHealth(){ return {devices:[], hr:[], rhr:{}, hrv:{}, steps:{}, stepsHr:{}, bp:[], sleep:{}, stress:[], spo2:[], water:{}, alerts:{prefs:{on:true, sys:false, quiet:true, cats:Object.fromEntries(COACH_CATS.map(c => [c[0], true]))}, sent:{}, log:[]}}; }
function normHealth(h){ const f = freshHealth(); h = Object.assign(f, h || {}); h.alerts = Object.assign(freshHealth().alerts, h.alerts || {}); h.alerts.prefs = Object.assign(freshHealth().alerts.prefs, h.alerts.prefs || {}); h.alerts.prefs.cats = Object.assign(freshHealth().alerts.prefs.cats, h.alerts.prefs.cats || {}); return h; }
const hk = () => state.health;
const hourKey = t => { const d = new Date(t); return `${dkey(d)} ${pad(d.getHours())}`; };
function trimHealth(h){
  const now = Date.now(), cut = k => dkey(new Date(now - k*DAY_MS));
  h.hr = h.hr.filter(x => x[0] > now - 7*DAY_MS).slice(-2100);
  h.bp = h.bp.filter(x => x[0] > now - 90*DAY_MS).slice(-300);
  h.stress = h.stress.filter(x => x[0] > now - 7*DAY_MS).slice(-700);
  h.spo2 = h.spo2.filter(x => x[0] > now - 7*DAY_MS).slice(-700);
  for (const key of ["rhr","hrv","steps","sleep","water"]) for (const d in h[key]) if (d < cut(60)) delete h[key][d];
  for (const k in h.stepsHr) if (k < cut(2)) delete h.stepsHr[k];
  h.alerts.log = h.alerts.log.slice(0, 30);
  for (const k in h.alerts.sent) if (h.alerts.sent[k] < now - 3*DAY_MS) delete h.alerts.sent[k];
}
function addHr(h, t, bpm){
  if (!(bpm > 25 && bpm < 240)) return;
  const b = Math.floor(t / 3e5) * 3e5, last = h.hr[h.hr.length - 1];
  if (last && last[0] === b) { last[2] = (last[2] || 1) + 1; last[1] = Math.round(last[1] + (bpm - last[1]) / last[2]); }
  else { const i = h.hr.findIndex(x => x[0] === b); if (i >= 0) h.hr[i][1] = Math.round((h.hr[i][1] + bpm) / 2); else h.hr.push([b, Math.round(bpm), 1]); }
}
const sortHealth = h => { for (const k of ["hr","bp","stress","spo2"]) h[k].sort((a,b) => a[0] - b[0]); };
const latest = (arr, maxAge) => { const x = arr[arr.length - 1]; return x && (!maxAge || Date.now() - x[0] <= maxAge) ? x : null; };
const hrMax = () => Math.round(208 - 0.7 * state.profile.age);
const waterGoal = () => clamp(Math.round(state.profile.weightKg * 30 / 250), 6, 14);
function bpCategory(s, d){
  if (s > 180 || d > 120) return ["Severe — retake now", "high", 4];
  if (s >= 140 || d >= 90) return ["High · stage 2", "high", 3];
  if (s >= 130 || d >= 80) return ["High · stage 1", "med", 2];
  if (s >= 120) return ["Elevated", "med", 1];
  return ["Normal", "low", 0];
}
const avgOf = (obj, days, skipToday = true) => { const v = []; for (let i = skipToday ? 1 : 0; i <= days; i++){ const k = dkey(new Date(Date.now() - i*DAY_MS)); if (obj[k] != null) v.push(obj[k]); } return v.length >= 3 ? v.reduce((a,b) => a + b, 0) / v.length : null; };
function stepsLastHour(h){ const now = new Date(); return (h.stepsHr[hourKey(now)] || 0) * (now.getMinutes() < 20 ? 1 : 1) + (now.getMinutes() < 30 ? (h.stepsHr[hourKey(now - H_MS)] || 0) * (30 - now.getMinutes()) / 60 : 0); }

/* The coach: every rule returns {key, cat, level 1 info · 2 caution · 3 urgent, text}. Everything that fires is combined into ONE message. */
function coachFindings(){
  const h = hk(), p = state.profile, now = new Date(), today = dkey(now), hour = now.getHours(), out = [];
  const trainedToday = state.training.sessions.some(s => s.date === today) || (ui.draft && ui.draft.items.some(it => it.sets.some(s => s.done)));
  const add = (key, cat, level, text) => out.push({key, cat, level, text});
  // heart rate
  const hr = latest(h.hr, 15*60e3), max = hrMax();
  if (hr){
    const recentlyActive = trainedToday || stepsLastHour(h) > 600 || ui.liveHR;
    if (hr[1] >= max) add("hr-over-max", "heart", 3, `Your heart rate is ${hr[1]} bpm, at or above your estimated max of ${max}. Stop, sit down and breathe slowly. Are you OK? If you feel chest pain, dizziness, fainting or shortness of breath, call 911.`);
    else if (recentlyActive && hr[1] >= 0.9 * max) add("hr-high-workout", "heart", 2, `Your heart rate is ${hr[1]} bpm, above 90% of your estimated max (${max}). Ease off and let it come down. Are you OK?`);
    else if (!recentlyActive && hr[1] > 100){ const prev = h.hr.filter(x => x[0] > Date.now() - 30*60e3 && x[0] < hr[0]); if (prev.length && prev.every(x => x[1] > 100)) add("hr-high-rest", "heart", 2, `Your heart rate has stayed above 100 bpm (${hr[1]} now) while you've been resting. Sit, drink some water and breathe slowly. If it stays high or you feel unwell, contact a doctor.`); }
  }
  const rhrBase = avgOf(h.rhr, 7), rhrT = h.rhr[today];
  const hrvBase = avgOf(h.hrv, 7), hrvT = h.hrv[today];
  const sleepLast = h.sleep[today];
  const trained3 = [0,1,2].every(i => state.training.sessions.some(s => s.date === dkey(new Date(Date.now() - i*DAY_MS))));
  const recovery = [];
  if (rhrBase && rhrT && rhrT >= rhrBase + 7) recovery.push(`your resting heart rate is ${Math.round(rhrT - rhrBase)} bpm above your usual`);
  if (hrvBase && hrvT && hrvT < 0.8 * hrvBase) recovery.push(`your HRV is ${Math.round((1 - hrvT/hrvBase)*100)}% below normal`);
  if (sleepLast != null && sleepLast < 7) recovery.push(`you slept ${fmt1(sleepLast)} h (adults need 7+)`);
  if (trained3) recovery.push("you've trained three days in a row");
  if (recovery.length >= 2 || (recovery.length && trained3)) add("recovery", "recovery", 2, `Get some rest: ${recovery.join(", ")}. Make today an easy walk or mobility day and aim for an earlier bedtime.`);
  else if (recovery.length) add("recovery-light", "recovery", 1, `Heads up: ${recovery[0]}. Keep today's workout moderate.`);
  // steps
  const st = h.steps[today] || 0, marks = [10000, 7500, 5000, 2000].filter(m => st >= m);
  if (marks.length) add(`steps-${marks[0]}-${today}`, "activity", 1, `You've reached ${fmt(marks[0])} steps today${marks[0] < 10000 ? `. ${fmt(10000 - st)} more for 10,000` : ". Great work"}.`);
  if (hour >= 9 && hour < 19 && h.stepsHr[hourKey(now)] != null && stepsLastHour(h) < 100 && !trainedToday) add("sedentary", "activity", 1, "You've been still for about an hour. Stand up and walk for 3–5 minutes.");
  // water
  const w = h.water[today] || 0, goal = waterGoal();
  const expected = Math.round(goal * clamp((hour - 7) / 13, 0, 1));
  if (trainedToday && w < expected) add("water-workout", "hydration", 1, `Rehydrate after your workout: drink a glass of water (${w} of about ${goal} glasses today).`);
  else if (hour >= 11 && w < expected - 2) add("water", "hydration", 1, `Drink a glass of water. You've had ${w} of about ${goal} glasses today.`);
  // blood pressure
  const bp = latest(h.bp, DAY_MS);
  if (bp){ const [label,,lvl] = bpCategory(bp[1], bp[2]);

/* ---------------- buddies & groups ----------------
   Shared, realtime data in this artifact's database:
     groups/{gid}  {name, kind, code, owner, members[], coaches[], pending[], invites[], created}
     codes/{CODE}  {gid}                               join-code lookup
     feeds/{gid}   {events[] (newest first, max 60), stats{uid:{week,workouts,sets,streak,foodDays,last}}}
   Private per person: data/users/{uid}/buddies {share:{workouts,prs,details,food}}
   Only opaque user ids are stored; names come from the viewer's directory at render time. */
const APP_URL = window.RR_PUBLIC ? location.origin : "https://claude.ai/artifact/72ewqghJbUCu7HDfHGCrD2";
const GROUP_KINDS = {friends:"Friends", family:"Family", coworkers:"Co-workers", trainer:"Coach & clients", team:"Team or club"};
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const bud = {state:"idle", me:null, user:null, groups:{}, feeds:{}, subs:{}, names:{}, invitedTo:[], sel:null, share:{workouts:true, prs:true, details:false, food:false}, search:[], searchQ:"", inviteMsg:"", dirty:false, busy:false};
const weekStart = (d = new Date()) => dkey(addDays(d, -wIdx(d)));
const nameOf = id => id === bud.me ? "You" : ((bud.names[id] && bud.names[id].name) || "Someone");
const avatarOf = id => (bud.names[id] && bud.names[id].avatarUrl) || "";
function busy(on){ bud.busy = on; document.body.style.cursor = on ? "progress" : ""; }
function softRender(){
  const a = document.activeElement;
  if (a && a.closest && a.closest("#view") && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) { bud.dirty = true; return; }
  if (ui.view === "buddies") render(); else renderNav();
}
document.addEventListener("focusout", () => { if (bud.dirty) { bud.dirty = false; setTimeout(() => { if (ui.view === "buddies") render(); }, 0); } });

async function initBuddies(){
  if (store.mode !== "cloud" || !store.db) { bud.state = "off"; softRender(); return; }
  bud.state = "loading"; bud.me = store.uid;
  try { bud.user = await window.claude.use("user"); } catch { bud.user = null; }
  try { const s = await store.db.doc(`data/users/${bud.me}/buddies`).get(); if (s.exists) Object.assign(bud.share, (s.data() || {}).share || {}); } catch {}
  store.db.collection("groups").where("members", "array-contains", bud.me).onSnapshot(snap => {
    bud.groups = {}; for (const d of snap.docs) bud.groups[d.id] = Object.assign({id:d.id}, d.data());
    if (!bud.sel || !bud.groups[bud.sel]) bud.sel = Object.keys(bud.groups)[0] || null;
    syncFeeds(); bud.state = "ready"; loadNames(); softRender();
  }, e => { console.warn("groups", e); bud.state = "error"; softRender(); });
  store.db.collection("groups").where("pending", "array-contains", bud.me).onSnapshot(snap => {
    bud.invitedTo = snap.docs.map(d => Object.assign({id:d.id}, d.data())); loadNames(); softRender();
  }, () => {});
}
function syncFeeds(){
  for (const gid in bud.groups) if (!bud.subs[gid]) bud.subs[gid] = store.db.doc(`feeds/${gid}`).onSnapshot(s => { bud.feeds[gid] = s.exists ? s.data() : {events:[], stats:{}}; loadNames(); softRender(); }, () => {});
  for (const gid in bud.subs) if (!bud.groups[gid]) { bud.subs[gid](); delete bud.subs[gid]; delete bud.feeds[gid]; }
}
async function loadNames(){
  if (!bud.user) return;
  const ids = new Set([bud.me]);
  for (const g of [...Object.values(bud.groups), ...bud.invitedTo]) for (const k of ["members","coaches","pending"]) (g[k] || []).forEach(i => ids.add(i)), ids.add(g.owner);
  for (const f of Object.values(bud.feeds)) (f.events || []).forEach(e => ids.add(e.by));
  const list = [...ids].filter(Boolean);
  try { const ps = await bud.user.profiles(list); let changed = false;
    for (const id of list) if (!bud.names[id] || bud.names[id].name !== ps[id].name) { bud.names[id] = ps[id]; changed = true; }
    if (changed) softRender(); } catch {}
}
function newCode(){ let s = ""; const a = new Uint32Array(8); crypto.getRandomValues(a); for (const n of a) s += CODE_CHARS[n % CODE_CHARS.length]; return s; }
/* Every group gets its own permanent code. A code is claimed under a short lease so two groups can never take the same one,
   and codes are never deleted or reissued, so each one stays valid for as long as the app exists (32^8 ≈ 1.1 trillion possibilities). */
async function claimCode(gid){
  for (let i = 0; i < 40; i++){
    const code = newCode(), ref = store.db.doc(`codes/${code}`);
    const lease = await ref.acquire({holder: bud.me + ":" + gid, ttlMs: 5000});
    if (!lease.acquired) continue;
    const cur = await ref.get();
    if (cur.exists && (cur.data() || {}).gid) continue;
    await ref.set({gid, created: Date.now(), by: bud.me});
    const check = await ref.get();
    if (check.exists && check.data().gid === gid) return code;
  }
  throw new Error("code");
}
async function createGroup(name, kind, coach){
  busy(true);
  try {
    const gid = uid(), code = await claimCode(gid);
    await store.db.doc(`groups/${gid}`).set({name, kind, code, owner:bud.me, members:[bud.me], coaches: coach ? [bud.me] : [], pending:[], invites:[], created:Date.now()});
    await store.db.doc(`feeds/${gid}`).set({events:[{id:uid(), by:bud.me, kind:"join", text: coach ? "started the group as coach" : "started the group", at:Date.now(), cheers:[]}], stats:{}});
    bud.sel = gid; await postStats([gid]);
    toast(`${name} is ready. Invite people with code ${code}.`);
  } catch (e){ console.warn(e); toast(e && e.code === "quota_exceeded" ? "The group database is full. Remove an old group first." : "Couldn't create the group. Try again."); }
  busy(false); render();
}
async function joinGroup(gid, coach){
  const ref = store.db.doc(`groups/${gid}`), s = await ref.get();
  if (!s.exists) { toast("That group no longer exists."); return false; }
  const g = s.data(), add = (arr, v) => arr.includes(v) ? arr : [...arr, v];
  await ref.update({members: add(g.members || [], bud.me), pending: (g.pending || []).filter(x => x !== bud.me), coaches: coach ? add(g.coaches || [], bud.me) : (g.coaches || [])});
  await addEvent(gid, {kind:"join", text: coach ? "joined as coach" : "joined the group"});
  bud.sel = gid; await postStats([gid]); toast(`You're in ${g.name}.`); return true;
}
async function joinByCode(raw, coach){
  const code = raw.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length < 6 || code.length > 8) { toast("Codes are 8 letters and numbers (older groups have 6)."); return; }
  busy(true);
  try { const c = await store.db.doc(`codes/${code}`).get();
    if (!c.exists) toast("No group uses that code. Check it with the person who invited you.");
    else if (bud.groups[c.data().gid]) { bud.sel = c.data().gid; toast("You're already in that group."); }
    else await joinGroup(c.data().gid, coach);
  } catch (e){ console.warn(e); toast("Couldn't join right now. Try again."); }
  busy(false); render();
}
async function addEvent(gid, ev){
  const ref = store.db.doc(`feeds/${gid}`), s = await ref.get(), cur = s.exists ? s.data() : {events:[], stats:{}};
  const events = [Object.assign({id:uid(), by:bud.me, at:Date.now(), cheers:[]}, ev), ...(cur.events || [])].slice(0, 60);
  if (s.exists) await ref.update({events}); else await ref.set({events, stats:{}});
}
function myStats(){
  const ws = weekStart(), sessions = state.meta.demo ? [] : state.training.sessions;
  const wk = sessions.filter(s => s.date >= ws);
  let streak = 0; for (let i = 0; i < 52; i++){ const a = dkey(addDays(pkey(ws), -7*i)), b = dkey(addDays(pkey(ws), 7 - 7*i)); if (sessions.some(s => s.date >= a && s.date < b)) streak++; else if (i > 0) break; }
  const foodDays = bud.share.food && !state.meta.demo ? Object.keys(state.food.log).filter(k => k >= ws && state.food.log[k].length).length : null;
  return {week:ws, workouts:wk.length, sets: wk.reduce((a,s) => a + s.items.reduce((b,it) => b + it.sets.length, 0), 0), streak, foodDays, last: sessions.length ? sessions[sessions.length-1].date : null};
}
async function postStats(gids = Object.keys(bud.groups)){
  if (bud.state !== "ready" && bud.state !== "loading") return;
  const st = myStats();
  await Promise.all(gids.map(gid => store.db.doc(`feeds/${gid}`).update({stats:{[bud.me]: st}}).catch(() => {})));
}
async function shareSession(sess, prs){
  if (bud.state !== "ready" || state.meta.demo) return;
  const gids = Object.keys(bud.groups);
  if (!gids.length) return;
  const sets = sess.items.reduce((a,it) => a + it.sets.length, 0);
  const detail = bud.share.details ? sess.items.map(it => `${EX[it.ex].name}: ${it.sets.map(s => s.v + (EX[it.ex].metric === "time" ? "s" : "") + (s.load ? ` @ ${fmt1(wDisp(s.load))} ${wUnit()}` : "")).join(", ")}`).join(" · ") : "";
  try {
    if (bud.share.workouts) for (const gid of gids) await addEvent(gid, {kind:"workout", text:`finished ${sess.name} · ${sess.items.length} exercises · ${sets} sets`, detail, prs: bud.share.prs ? prs : []});
    else if (bud.share.prs && prs.length) for (const gid of gids) await addEvent(gid, {kind:"pr", text:`set a new personal best`, prs});
    await postStats(gids);
  } catch (e){ console.warn("share", e); }
}
async function toggleCheer(gid, eid){

  ev.cheers = (ev.cheers || []).includes(bud.me) ? ev.cheers.filter(x => x !== bud.me) : [...(ev.cheers || []), bud.me];

}
function parseContact(raw){
  const v = raw.trim();
  if (/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return {via:"email", to:v, masked: v.replace(/^(.)[^@]*(@.*)$/, "$1•••$2")};
  const digits = v.replace(/[^\d+]/g, "");
  if (digits.replace(/\D/g, "").length >= 10) return {via:"sms", to:digits, masked:"•••-•••-" + digits.replace(/\D/g, "").slice(-4)};
  return null;
}

async function sendInvite(gid, raw){

  bud.inviteMsg = body;
  try { await store.db.doc(`groups/${gid}`).update({invites: [{c:c.masked, via:c.via, at:Date.now(), by:bud.me}, ...(g.invites || [])].slice(0, 30)}); } catch {}

  render();

document.addEventListener("change", e => {
  const el = e.target, f = el.dataset.field; if (!f || !state) return;
  const p = state.profile, v = el.value;

    case "sugSlot": ui.sugSlot = v; render(); break;
    case "impact": p.impact = +v; reb(); break;
    case "daysPerWeek": p.daysPerWeek = +v; reb(); break;
    case "goal": p.goal = v; reb(); break;
    case "libPattern": ui.lib.pattern = v; render(); break;

document.addEventListener("submit", e => {
  const form = e.target.closest("[data-form]"); if (!form) return; e.preventDefault();
  const t = form.dataset.form;
  if (t === "weight" || t === "weight2"){
    const val = +(t==="weight" ? $("#wq").value : $("#wval").value), date = t==="weight2" ? ($("#wdate").value || todayKey()) : todayKey();
    const kg = wIn(val); if (!(kg > 25 && kg < 320)){ toast(`Enter a weight in ${wUnit()}.`); return; }
    setWeight(r1(kg*100)/100, date > todayKey() ? todayKey() : date); persist("training","profile"); render(); toast(`Logged ${fmt1(val)} ${wUnit()} for ${shortDate(date)}`);
  } else if (t === "reading"){
    const h = state.health, ty = $("#rdType").value, v = +$("#rdV").value, v2 = +$("#rdV2").value, now = Date.now(), k = todayKey();
    const bad = m => { toast(m); };
    if (ty === "hr"){ if (!(v > 25 && v < 240)) return bad("Enter a heart rate between 25 and 240."); addHr(h, now, v); }
    else if (ty === "bp"){ if (!(v > 60 && v < 260 && v2 > 30 && v2 < 160)) return bad("Enter both numbers, e.g. 128 and 82."); h.bp.push([now, Math.round(v), Math.round(v2)]); }
    else if (ty === "steps"){ if (!(v >= 0 && v < 100000)) return bad("Enter today's steps."); h.steps[k] = Math.round(v); h.stepsHr[hourKey(now)] = h.stepsHr[hourKey(now)] || 0; }
    else if (ty === "sleep"){ if (!(v > 0 && v < 16)) return bad("Enter hours slept, e.g. 7.5."); h.sleep[k] = v; }
    else if (ty === "stress"){ if (!(v >= 0 && v <= 100)) return bad("Stress is 0 to 100."); h.stress.push([now, Math.round(v)]); }
    else if (ty === "spo2"){ if (!(v >= 70 && v <= 100)) return bad("Blood oxygen is a percentage, e.g. 97."); h.spo2.push([now, Math.round(v)]); }
    else if (ty === "rhr"){ if (!(v > 30 && v < 130)) return bad("Enter a resting heart rate, e.g. 62."); h.rhr[k] = Math.round(v); }
    sortHealth(h); persist("health"); toast("Reading saved"); runCoach(true); render();
  } else if (t === "budCreate"){
    const name = $("#budName").value.trim().slice(0,40); if (!name){ toast("Give the group a name."); return; }
    createGroup(name, $("#budKind").value, $("#budCoach").checked);
  } else if (t === "budJoin"){ joinByCode($("#budCode").value, $("#budJoinCoach").checked);
  } else if (t === "budInvite"){ const v = $("#budContact").value; if (bud.sel) sendInvite(bud.sel, v).catch(() => toast("Couldn't record that invite."));
  } else if (t === "custom"){
    const g = id => +$(id).value || 0, name = $("#cf-name").value.trim();
    if (!name){ toast("Give the food a name."); return; }
    const f = {id:null, name, serv:"serving", kcal:g("#cf-kcal"), p:g("#cf-p"), c:g("#cf-c"), f:g("#cf-f"), s:g("#cf-s"), as:g("#cf-as")};
    (state.food.log[ui.nutDate] ||= []).push(entryFrom(f, Math.max(0.25, +ui.foodQty||1), ui.foodMeal)); persist("food"); ui.customOpen = false; render(); toast(`Added ${name}`);
  }
});

      <label class="f">Email<input id="gEmail" type="email" autocomplete="email" required></label>
      <label class="f">Password (8+ characters)<input id="gPw" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="check" style="border:0"><input id="gAgree" type="checkbox" required><span style="text-decoration:none;color:var(--ink)">I agree to the <a href="/terms.html" target="_blank">Terms</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a>, and understand the app gives general fitness guidance, not medical advice.</span></label>
      <div class="gerr" id="gErr"></div><button class="btn primary">Create account</button>
      <p class="small muted">Already have an account? <a href="#" data-gmode="login">Log in</a></p></form>`;
    if (mode === "login") return `<form class="card stack gform" data-gate="login"><h2>Log in</h2>
      <label class="f">Email<input id="gEmail" type="email" autocomplete="email" required></label>
      <label class="f">Password<input id="gPw" type="password" autocomplete="current-password" required></label>
      <div class="gerr" id="gErr"></div><button class="btn primary">Log in</button>
      <p class="small muted"><a href="#" data-gmode="forgot">Forgot password?</a> · New here? <a href="#" data-gmode="signup">Start a free trial</a></p></form>`;
    if (mode === "forgot") return `<form class="card stack gform" data-gate="forgot"><h2>Reset your password</h2><label class="f">Email<input id="gEmail" type="email" required></label><div class="gerr" id="gErr"></div><button class="btn primary">Email me a reset link</button><p class="small muted"><a href="#" data-gmode="login">Back to log in</a></p></form>`;
    return `<form class="card stack gform" data-gate="reset"><h2>Choose a new password</h2><label class="f">New password (8+ characters)<input id="gPw" type="password" minlength="8" required></label><div class="gerr" id="gErr"></div><button class="btn primary">Save password</button></form>`;
  };
  let gmode = "signup";
  function landing(){
    const feats = [["Plans built for you","BMI, calories and macros from your stats, with a 7-day menu and workout week for fat loss, muscle or maintenance."],["Menus your way","77 recipes built to MyPlate, DASH, Mediterranean, heart-healthy and diabetes-plate guidance. Leave out shellfish, pork, dairy, gluten and more."],["200 foods, full macros","Log meals in a tap and see protein, carbs, fat and sugar against your targets."],["125 exercises","Low to high impact, bodyweight to kettlebells, with rep and set logging and personal bests."],["Watch sync · coming soon","Our iPhone and Android app will sync Apple Watch and Galaxy Watch data automatically, with one clear health tip when something needs attention."],["Buddies","Invite friends, family, co-workers or your coach by text or email. Share workouts and cheer each other on."]];
    return `<div class="gnav">${logo}<div class="row"><button class="btn sm" data-gmode="login">Log in</button><button class="btn sm primary" data-gmode="signup">Start free trial</button></div></div>
      <div class="ghero"><div><h1>Train it. Eat it. <span>Track both.</span></h1><p class="lead">Rep &amp; Ration builds your meals and workouts around your goal, tracks every rep and every plate, and keeps your crew in it with you.</p>
        <div class="gcta"><button class="btn primary" data-gmode="signup">Start your 7-day free trial</button><button class="btn" data-gmode="login">Log in</button></div>
        <p class="small muted" style="margin-top:10px">Card required · $0 today · $30/month after 7 days · cancel any time</p></div>
        <div class="card stack"><span class="eyebrow">Membership</span><div class="row" style="align-items:baseline"><span class="big" style="font-size:3rem">$30</span><span class="muted">/ month</span></div><p class="small muted">7 days free, then $30 a month. Cancel any time from your account.</p><ul class="small" style="margin:0;padding-left:18px;line-height:1.8"><li>Personal calorie, macro and meal plan</li><li>Workout week with rep and set logging</li><li>Buddies groups for friends, family and your coach</li></ul><button class="btn primary" data-gmode="signup">Start free trial</button></div></div>
      <div class="gfeat">${feats.map(f => `<div class="card"><h3>${f[0]}</h3><p class="small muted">${f[1]}</p></div>`).join("")}</div>
      <div class="gprice" style="grid-template-columns:1fr;justify-items:center"><div id="gForm">${form(gmode)}</div></div>${foot}`;
  }
  function show(view, u){
    const g = $g("#gate"), b = $g("#gateBody"); g.hidden = false;
    if (view === "landing") b.innerHTML = landing();
    else if (view === "reset") b.innerHTML = `<div class="gnav">${logo}</div>${form("reset")}${foot}`;
    else b.innerHTML = `<div class="gnav">${logo}<button class="btn sm" data-glogout>Log out</button></div>
      <section class="card stack gform" style="max-width:520px"><h2>${u.sub.canTrial ? "Start your 7-day free trial" : "Reactivate Rep & Ration"}</h2>
      <p class="muted">${u.sub.canTrial ? "Add a card to start your 7-day free trial. Nothing is charged today. On day 8 your card is billed $30, then every month until you cancel. Cancel any time before the trial ends and you won't be charged." : "Your subscription isn't active. Restart it to get back to your plan, logs and groups."}</p>
      <div class="gerr" id="gErr"></div><button class="btn primary" data-gcheckout>${u.sub.canTrial ? "Add card & start free trial" : "Subscribe · $30/month"}</button>
      <p class="small muted">Payments are handled securely by Stripe.</p></section>${foot}`;
  }
  const err = m => { const e = $g("#gErr"); if (e) e.textContent = m; };
  async function checkout(){ try { const j = await RR_API("billing/checkout", {}); location.href = j.url; } catch (e){ err(e.message); } }
  document.addEventListener("click", async e => {
    const m = e.target.closest("[data-gmode]"); if (m){ e.preventDefault(); gmode = m.dataset.gmode; const f = $g("#gForm"); if (f) f.innerHTML = form(gmode); else show("landing"); const el = $g("#gForm"); if (el) el.scrollIntoView({behavior:"smooth"}); return; }
    if (e.target.closest("[data-gdemo]")) { $g("#gate").hidden = true; return; }
    if (e.target.closest("[data-gcheckout]")) { checkout(); return; }
    if (e.target.closest("[data-glogout]")) { await RR_API("auth/logout", {}).catch(() => {}); location.href = "/"; }
  });
  document.addEventListener("submit", async e => {
    const f = e.target.closest("[data-gate]"); if (!f) return; e.preventDefault();
    const t = f.dataset.gate, v = id => ($g(id) || {}).value || "";
    const btn = f.querySelector("button"); btn.disabled = true; err("");
    try {
      if (t === "signup"){ const j = await RR_API("auth/signup", {name: v("#gName"), email: v("#gEmail"), password: v("#gPw")}); if (j.user.sub.billing && !j.user.sub.active) return checkout(); location.href = "/"; }
      else if (t === "login"){ await RR_API("auth/login", {email: v("#gEmail"), password: v("#gPw")}); location.href = "/"; }
      else if (t === "forgot"){ await RR_API("auth/reset-request", {email: v("#gEmail")}); err("If that email has an account, a reset link is on its way."); }
      else if (t === "reset"){ await RR_API("auth/reset", {token: new URLSearchParams(location.search).get("reset"), password: v("#gPw")}); location.href = "/?reset=done"; }
    } catch (x){ err(x.message); }
    btn.disabled = false;
  });
  window.RR_ME.then(u => {
    window.RR_USER = u;
    const qs = new URLSearchParams(location.search);
    if (qs.get("reset") && qs.get("reset") !== "done") return show("reset");
    if (!u) return show("landing");
    if (!u.sub.active) return show("paywall", u);
    if (qs.get("checkout") === "success") setTimeout(() => { try { toast("You're in. Your free trial has started."); } catch {} }, 800);
    if (qs.has("checkout") || qs.has("reset")) history.replaceState(null, "", "/" + location.hash);
  });
})();
</script>
